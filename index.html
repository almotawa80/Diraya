/* Layout: one phone-sized column. HUD on top, a "phone screen" stage whose wallpaper moves from dawn to night across the day, thumb controls at the bottom. Single committed night look. */
:root{

  --ink:#232C5A; --ink2:#2F3A70; --ink3:#3D4884; --line:#606690;

  --tq:#1FC8B4; --tq-ink:#04332E; --saffron:#E3BE7C; --saffron-ink:#3A2A0C; --coral:#FF6B6B; --coral-ink:#3F0A0A;

}

*{box-sizing:border-box}

/* ---------- home ---------- */
.brand{display:flex;align-items:center;gap:1.2rem;padding:.9rem .9rem .5rem}
.bell{position:relative;width:4.6rem;height:4.6rem;flex:none;border-radius:50%;background:var(--ink3);box-shadow:inset 0 0 0 3px var(--saffron);display:grid;place-items:center}

{id:'y4',t:'y',ch:'social',from:'منصة الخليج للتداول الذكي',sub:'إعلان مموَّل',body:'📈 [[أرباح مضمونة 30% أسبوعيًا]] بالذكاء الاصطناعي. ابدأ بـ 100 د.ك فقط وشوف تحويلات عملائنا 👇 [[المقاعد محدودة]].',insp:'لا يوجد رقم ترخيص، والشركة غير مدرجة لدى هيئة أسواق المال.',scam:1,lever:'greed',loss:100,tell:'كلمة «مضمونة» تكفي. لا يوجد استثمار حقيقي يضمن ربحًا، وصور التحويلات تُفبرك.',right:'تجاهل وبلّغ. ولا تستثمر إلا عند جهة مرخّصة تتأكد منها بنفسك.',acts:[['أتجاهل وأبلّغ عن الإعلان: ما في ربح مضمون',2,'صح. الوعد بربح مضمون علامة احتيال كافية وحدها.'],['أسألهم بالخاص عن الترخيص',1,'بيرسلون شهادة مزوّرة. التأكد يكون من موقع الجهة الرقابية نفسها.'],['أجرّب بمبلغ صغير 20 د.ك',0,'يتركونك تربح أول مرة لتضع أكثر، ثم يختفي الكل.',20]]},
{id:'y5',t:'y',ch:'wa',from:'مشتري من تطبيق المستعمل',sub:'+965 9••• ••15',ctx:'<b>الموقف:</b> عارض كنبة للبيع بـ 90 د.ك.',body:'أبيها بدون مفاصل. بدفع لك أونلاين الحين، ادخل هالرابط و[[حط بيانات بطاقتك عشان تستلم المبلغ]]: {{pay-receive-kw.link}}',insp:'استلام المال لا يحتاج رقم البطاقة ولا تاريخها ولا الرمز الخلفي. يكفي الآيبان.',scam:1,lever:'trust',loss:260,tell:'من يستلم المال لا يُدخل بيانات بطاقته. هذه صفحة سحب متنكرة في شكل صفحة إيداع.',right:'كاش عند الاستلام، أو تحويل على الآيبان فقط.',acts:[['أقول له: كاش عند الاستلام أو تحويل على الآيبان',2,'صح. المشتري الجاد يقبل، والمحتال يختفي.'],['أتجاهله وأنتظر مشتري ثاني',1,'آمن. وتذكّر القاعدة مع المشتري القادم.'],['أدخل رقم البطاقة بس، بدون الرمز السري',0,'رقم البطاقة وتاريخها والرمز الخلفي تكفي للسحب.',260]]},
{id:'y6',t:'y',ch:'sms',from:'TRAFFIC-KW',sub:'رسالة نصية',body:'لديك مخالفة مرورية غير مسددة. [[سيتم حجز المركبة ومنع السفر]] إن لم تُسدَّد اليوم: [[{{fines-kw-pay.site}}]]',insp:'مرسلة من رقم جوال عادي، والرابط ليس نطاقًا حكوميًا.',scam:1,lever:'fear',loss:210,tell:'تهديد كبير ومهلة قصيرة ورابط غير حكومي. المخالفات تظهر في التطبيق الحكومي الرسمي.',right:'افتح تطبيق «سهل» أو موقع وزارة الداخلية بنفسك وتحقق من المخالفات.',acts:[['أفتح التطبيق الحكومي الرسمي بنفسي وأشوف المخالفات',2,'ممتاز. إن كانت هناك مخالفة فستجدها هناك.'],['أحذف الرسالة',1,'آمن. والتأكد من التطبيق الرسمي يريح بالك.'],['أتصل على الرقم المرسِل وأستفسر',0,'الرقم للمحتال نفسه، وسيكمل الضغط بصوته.']]},
{id:'y7',t:'y',ch:'wa',from:'شركة توظيف عن بُعد',sub:'+44 7••• ••3981',body:'مرحبًا 👋 وظيفة من البيت: [[5 د.ك عن كل لايك]] وتقييم. أول مهمة تُدفع فورًا! بعدها [[تدفع 30 د.ك لفتح المهام الذهبية]].',insp:'رقم دولي، ولا يوجد اسم شركة ولا عقد ولا مقابلة.',scam:1,lever:'greed',loss:30,tell:'الوظيفة الحقيقية تدفع لك ولا تطلب منك أن تدفع. الدفعة الأولى الصغيرة طُعم.',right:'بلوك وتبليغ. أي عمل يطلب منك مالًا لتبدأ ليس عملًا.',acts:[['بلوك وتبليغ',2,'صح. من يطلب مالًا لتشتغل عنده ليس صاحب عمل.'],['آخذ أول مهمة مجانية وأوقف',0,'المهمة الأولى تسحب منك بياناتك ورقم حسابك، وتبدأ سلسلة الضغط.'],['أسأل عن اسم الشركة وسجلها',1,'بيعطونك أي اسم. العلامة الكافية أنهم يطلبون مالًا.']]},
{id:'y8',t:'y',ch:'call',from:'الدعم الفني للبنك',sub:'+965 2••• ••77',body:'معاك الدعم الفني. تطبيق البنك عندك فيه خلل أمني. [[نزّل برنامج المساعدة عن بُعد]] و[[عطني الرقم اللي يطلع لك]] ونصلحه خلال دقيقتين.',insp:'البنك لا يطلب تنزيل أي برنامج تحكم. هذا البرنامج يعطي المتصل شاشة جوالك كاملة.',scam:1,lever:'authority',loss:600,tell:'برنامج التحكم عن بُعد يجعل المحتال يرى شاشتك ويفتح تطبيق البنك بيدك.',right:'لا تنزّل أي برنامج بطلب متصل. أغلق واتصل بالبنك.',acts:[['أسكّر وأتصل بالبنك من الرقم خلف البطاقة',2,'صح. وأي خلل حقيقي يُحلّ من التطبيق الرسمي أو الفرع.'],['أسكّر وبس',1,'حميت نفسك. بلّغ البنك حتى يحذّر غيرك.'],['أنزّل البرنامج بس ما أعطيه الرقم',0,'مجرد وجود البرنامج خطر. احذفه فورًا.']]},
{id:'y9',t:'y',ch:'notif',from:'تطبيق البنك',sub:'إشعار من التطبيق',body:'تم إيداع راتب بمبلغ 850.000 د.ك في حسابك المنتهي بـ 4410.',insp:'إشعار من التطبيق المثبّت على جوالك، بدون رابط ولا طلب.',scam:0,ok:'خبر فقط من التطبيق نفسه. لا رابط، لا طلب، لا استعجال.'},
{id:'y10',t:'y',ch:'sms',from:'البنك',sub:'رسالة نصية',ctx:'<b>الموقف:</b> أنت الآن تدفع 23.500 د.ك في موقع الجمعية.',body:'رمز التحقق 482913 لعملية شراء بمبلغ 23.500 د.ك لدى COOP-ONLINE. لا تشارك الرمز مع أحد.',insp:'المبلغ والتاجر يطابقان ما تفعله الآن، ولم يطلب أحد منك الرمز.',scam:0,yes:'أُدخل الرمز بنفسي',ok:'أنت من بدأ العملية، والمبلغ والتاجر مطابقان، والرمز تُدخله أنت ولا تقوله لأحد.'},
{id:'y11',t:'y',ch:'call',from:'البنك',sub:'الرقم المحفوظ في جهات الاتصال',ctx:'<b>الموقف:</b> اشتريت قبل دقيقة من متجر إلكتروني بـ 64.000 د.ك.',body:'معاك البنك. في عملية بـ 64.000 د.ك من متجر إلكتروني قبل دقيقة. أنت من قام بها؟ ما نحتاج أي رمز أو بيانات.',insp:'لم يطلب رمزًا ولا رقمًا سريًا ولا تحويلًا، والعملية تطابق ما فعلته.',scam:0,soft:1,yes:'أجاوب: نعم أنا',ok:'الفرق في الطلب وليس في القناة: لم يطلب أي سر. ولو أغلقت واتصلت بالبنك بنفسك فهذا مقبول دائمًا.'},
{id:'y12',t:'y',ch:'sms',from:'طرد إكسبرس',sub:'رسالة نصية',ctx:'<b>الموقف:</b> تنتظر طلبية منذ أسبوع.',body:'شحنتك KW48213 خرجت للتوصيل اليوم. المندوب سيتصل بك قبل الوصول. الدفع عند الاستلام.',insp:'نفس المرسل الذي أكّد طلبك قبل أسبوع. لا رابط ولا مبلغ مطلوب الآن.',scam:0,ok:'خبر يطابق طلبًا تنتظره، بدون رابط ولا دفع مسبق.'},
{id:'y13',t:'y',ch:'wa',from:'أمي',sub:'رقم محفوظ',body:'لا تنسون تمرّون الجمعية وإنتوا راجعين، نبي خبز ولبن.',insp:'رقم أمك المحفوظ، وطلب عادي.',scam:0,ok:'رقم محفوظ وطلب يومي عادي. ليس كل طلب احتيالًا.'},

{id:'e1',t:'e',ch:'call',from:'المباحث الإلكترونية',sub:'+965 2••• ••99',body:'معاك الملازم فيصل. اسمك طالع في قضية احتيال إلكتروني. [[حوّل رصيدك الحين على حساب آمن]] و[[لا تخبر أحد]]، القضية سرّية.',insp:'لا توجد جهة أمنية تطلب تحويل أموال بالهاتف. الاستدعاء الرسمي يكون بكتاب أو عبر القنوات الحكومية.',scam:1,lever:'authority',loss:1200,tell:'لا يوجد شيء اسمه «حساب آمن». وطلب السرّية يعزلك عن أهلك الذين سيكشفون الخدعة.',right:'أغلق الخط وكلّم أحد أبنائك، ثم اتصل بالبنك.',acts:[['أسكّر وأكلّم ولدي أو بنتي، وبعدها أتصل بالبنك',2,'بالضبط. المحتال يخاف من شخص ثانٍ يسمع القصة.'],['أسكّر وبس',1,'حميت مالك. خبّر أهلك والبنك لأنه سيعاود الاتصال.'],['أقول له: بروح المخفر وأتأكد',1,'فكرة سليمة، لكن لا تكمل الكلام معه. أغلق أولًا.']]},
{id:'e2',t:'e',ch:'call',from:'البنك · خدمة العملاء',sub:'+965 2••• ••40',body:'مساك الله بالخير. بطاقتك راح تتجدد اليوم. [[بيوصلك رمز برسالة، قوله لي]] عشان نفعّل البطاقة اليديدة.',insp:'رقم المتصل يمكن تزويره. البنك لا يطلب الرمز من أي عميل.',scam:1,lever:'authority',loss:650,tell:'الرمز الذي يصلك هو توقيعك على عملية سحب. البنك لا يطلبه أبدًا.',right:'الرمز لا يُقال لأحد. أغلق واتصل بالرقم المكتوب خلف البطاقة.',acts:[['أسكّر وأتصل بالرقم المكتوب خلف البطاقة',2,'صح. أنت من يتصل بالبنك.'],['أسكّر وبس',1,'آمن. والأفضل تبلّغ البنك.'],['أسأله: شنو اسمك ومن أي فرع؟',0,'عنده جواب جاهز لكل سؤال. لا تبقَ على الخط.']]},
{id:'e3',t:'e',ch:'wa',from:'+965 5••• ••61',sub:'رقم جديد بصورة ولدهم فهد',ctx:'<b>الموقف:</b> وصلت هالرسالة لأحد والديك، ويسألك: يحوّل؟',body:'يبه أنا فهد، هذا رقمي اليديد. [[محتاج 300 د.ك ضروري الحين]] وما أقدر أتكلم، حوّلهم على هالرقم وأفهّمك بعدين.',insp:'رقم غير محفوظ. رقم فهد المعروف ما زال في جوالك.',scam:1,lever:'trust',loss:300,tell:'رقم جديد، وطلب مال مستعجل، و«ما أقدر أتكلم». الثلاثة معًا علامة انتحال.',right:'اتصل على رقم فهد القديم قبل أي تحويل.',acts:[['أتصل على رقم فهد القديم',2,'ممتاز. مكالمة واحدة تكفي.'],['أسأله عن كلمة سر العائلة',2,'ممتاز. كلمة سر متفق عليها بين العائلة تهزم المنتحل.'],['أحوّل له، ما أخلّي ولدي محتاج',0,'عاطفتك هي ما يراهن عليه المحتال.',300]]},
{id:'e4',t:'e',ch:'sms',from:'BANK-ALERT',sub:'رسالة نصية',body:'عزيزنا العميل، [[سيتم إيقاف بطاقتك البنكية اليوم]] لعدم تحديث البيانات. للتحديث فورًا: [[{{bank-update-kw.info}}]]',insp:'ليست من نفس المرسل الذي تصلك منه رسائل بنكك، والرابط ليس موقع البنك.',scam:1,lever:'fear',loss:450,tell:'البنك لا يرسل رابطًا لتحديث البيانات. التحديث يكون في الفرع أو داخل التطبيق.',right:'تجاهل الرابط. وإن قلقت فاتصل بالبنك أو زُر الفرع.',acts:[['أتصل بالبنك من الرقم خلف البطاقة وأسأل',2,'صح. سيؤكدون لك أن بطاقتك سليمة.'],['أحذف الرسالة',1,'آمن.'],['أدخل الرابط وأحدّث بياناتي',0,'الصفحة تنسخ رقم بطاقتك ورمزك.',450]]},
{id:'e5',t:'e',ch:'sms',from:'ID-RENEW',sub:'رسالة نصية',body:'الهوية الرقمية: انتهت صلاحية بياناتك. جدّدها خلال 24 ساعة لتفادي [[غرامة 100 د.ك]]: [[{{id-renew-kw.site}}]]',insp:'الرابط ليس نطاقًا حكوميًا، والمرسل رقم جوال.',scam:1,lever:'fear',loss:180,tell:'الجهات الحكومية تنبّهك داخل تطبيقها الرسمي، لا برابط غريب في رسالة.',right:'افتح تطبيق «هويتي» أو «سهل» بنفسك، أو اسأل أحد من أهلك.',acts:[['أفتح التطبيق الحكومي الرسمي بنفسي',2,'صح.'],['أسأل ولدي يشوفها لي',2,'ممتاز. سؤال شخص تثق به من أقوى الحمايات.'],['أدخل الرابط قبل ما تنتهي المهلة',0,'المهلة مختلقة لتستعجل.',180]]},
{id:'e6',t:'e',ch:'call',from:'سحب الجوائز الكبرى',sub:'+965 6••• ••33',body:'مبروك! رقمك فاز معانا بـ [[10,000 د.ك]]. بس نحتاج [[رقم بطاقتك عشان نحوّل الجائزة]] ورسوم بسيطة 20 د.ك.',insp:'لم تشترك في أي سحب. والجوائز الحقيقية لا رسوم عليها.',scam:1,lever:'greed',loss:220,tell:'جائزة من سحب لم تدخله، مع طلب رقم البطاقة ورسوم. الجائزة الحقيقية لا تكلّفك شيئًا.',right:'أغلق الخط. ما في جائزة تحتاج بطاقتك.',acts:[['أسكّر الخط',2,'صح، ببساطة.'],['أقول له: خصموا الرسوم من الجائزة',1,'رد ذكي يكشفه، لكن لا تطوّل معه.'],['أعطيه رقم البطاقة بدون الرمز السري',0,'رقم البطاقة وحده يكفي لكثير من العمليات.',220]]},
{id:'e7',t:'e',ch:'wa',from:'قروب «استثمار الذهب»',sub:'أُضفت للقروب من رقم غريب',body:'الدكتور ماجد: مبروك للأعضاء أرباح هالأسبوع 🟡 [[ضاعف راتبك خلال شهر]]. التحويل على حساب المدير، و[[باقي 3 مقاعد]].',insp:'كل «الأعضاء» أرقام غريبة تمدح. لا يوجد ترخيص ولا عقد.',scam:1,lever:'greed',loss:500,tell:'شهادات الأعضاء في القروب مفبركة، والتحويل لحساب شخصي. لا استثمار حقيقي يضاعف المال في شهر.',right:'اخرج من القروب وبلّغ عنه. واستشر أبناءك أو بنكك قبل أي استثمار.',acts:[['أطلع من القروب وأبلّغ عنه',2,'صح.'],['أسأل البنك عن استثمار مرخّص',2,'ممتاز. الاستثمار يكون عبر جهة مرخّصة فقط.'],['أجرّب بـ 50 د.ك',0,'يردّون لك ربحًا صغيرًا أول مرة لتضع المبلغ الكبير.',50]]},
{id:'e8',t:'e',ch:'notif',from:'تطبيق البنك',sub:'إشعار من التطبيق',ctx:'<b>الموقف:</b> فعّلت الشهر الماضي الدفع التلقائي لفاتورة الكهرباء.',body:'تم خصم 12.500 د.ك لفاتورة الكهرباء والماء بالدفع التلقائي.',insp:'إشعار من تطبيق البنك نفسه، لدفعة أنت فعّلتها.',scam:0,ok:'خصم تعرفه من دفع تلقائي أنت فعّلته. لا رابط ولا طلب.'},
{id:'e9',t:'e',ch:'sms',from:'مستوصف المنطقة',sub:'رسالة نصية',body:'نذكّركم بموعدكم في المستوصف غدًا الساعة 9:30 صباحًا. يرجى إحضار البطاقة المدنية.',insp:'موعد حجزته أنت الشهر الماضي، من نفس المرسل.',scam:0,ok:'تذكير بموعد تعرفه. لا رابط ولا دفع.'},
{id:'e10',t:'e',ch:'wa',from:'أختي مريم',sub:'رقم محفوظ',body:'باجر الغدا عندنا، أمرّك الساعة 12؟ الكل مشتاق لك.',insp:'رقم مريم المحفوظ من سنين.',scam:0,ok:'رقم محفوظ وكلام عادي، بدون مال ولا أسرار.'},
{id:'e11',t:'e',ch:'sms',from:'البنك',sub:'رسالة نصية',body:'تذكير: لن نطلب منك أبدًا الرقم السري أو رمز التحقق عبر الهاتف أو الرسائل. حملة «لنكن على دراية».',insp:'من نفس المرسل الذي تصلك منه رسائل بنكك. لا رابط ولا طلب.',scam:0,ok:'رسالة توعية لا تطلب شيئًا. وهي القاعدة الأهم في اللعبة كلها.'},
{id:'e12',t:'e',ch:'call',from:'البنك',sub:'الرقم المحفوظ في جهات الاتصال',ctx:'<b>الموقف:</b> دفعت قبل دقائق 38.000 د.ك في الصيدلية.',body:'معاك البنك. في عملية بـ 38.000 د.ك في صيدلية قبل دقائق. أنت من قام بها؟ ما نحتاج أي رمز أو بيانات.',insp:'لم يطلب رمزًا ولا رقمًا سريًا، والعملية تطابق ما فعلته.',scam:0,soft:1,yes:'أجاوب: نعم أنا',ok:'الفرق في الطلب: لم يطلب أي سر. ولو أغلقت واتصلت بالبنك بنفسك فهذا مقبول دائمًا.'}

{id:'n1',ch:'sms',from:'FilmBox',sub:'رسالة نصية',body:'اشتراكك في منصة الأفلام [[سيتوقف اليوم]]. حدّث بطاقة الدفع من هنا: [[{{filmbox-renew.co}}]]',insp:'الاشتراك يُدار من داخل التطبيق نفسه أو من موقعه اللي تكتبه بنفسك، وليس من رابط في رسالة.',scam:1,lever:'fear',tell:'تهديد بإيقاف خدمة مع رابط لتحديث البطاقة. التحديث يكون داخل التطبيق نفسه.',right:'افتح التطبيق نفسه وتحقق من الاشتراك.'},
{id:'n2',ch:'life',from:'ملصق على طاولة المطعم',sub:'رمز QR',body:'على طاولة المطعم ملصق: «ادفع الفاتورة بسرعة من جوالك» مع [[رمز QR يفتح صفحة تطلب بيانات بطاقتك كاملة]].',insp:'أطراف الملصق مرفوعة وتحته رمز المطعم الأصلي.',scam:1,lever:'urgency',tell:'رمز QR ملصوق فوق الأصلي يأخذك إلى صفحة دفع مزيفة.',right:'ادفع عند الكاشير أو من جهاز الدفع اللي يجيبه الموظف.'},
{id:'n3',ch:'notif',from:'تطبيق «سهل»',sub:'إشعار من التطبيق',ctx:'<b>الموقف:</b> جدّدت دفتر السيارة أمس من التطبيق.',body:'تم تجديد دفتر المركبة بنجاح. يمكنك عرضه في قسم المستندات.',insp:'إشعار داخل التطبيق الرسمي المثبّت عندك، ويطابق معاملة قمت بها.',scam:0,ok:'إشعار داخل التطبيق الرسمي يطابق معاملة أنت قمت بها، بلا رابط ولا دفع.'},

{id:'n4',ch:'wa',from:'أم عبدالله (جارتكم)',sub:'رقم محفوظ',body:'هلا، وصلك [[رمز من 6 أرقام]] بالغلط على رقمك، [[ممكن ترسله لي]]؟ مستعجلة 🙏',insp:'الرمز الذي وصلك هو رمز تفعيل الواتس لحسابك أنت. حساب الجارة نفسه مسروق.',scam:1,lever:'trust',tell:'رمز تفعيل الواتس لا يُرسل لأحد. من يأخذه يسرق حسابك ويراسل أهلك باسمك.',right:'لا ترسل الرمز، واتصل بالجارة هاتفيًا لتنبيهها.'},
{id:'n5',ch:'social',from:'بوتيك_العطور_الأصلي',sub:'حساب متجر',body:'تصفية! عطر أصلي بـ 12 د.ك بدل 85. [[التحويل مقدمًا على رقم شخصي]] والتوصيل خلال ساعة. [[باقي 3 حبات]].',insp:'الحساب عمره أسبوعان، والمتابعون وهميون، ولا يوجد دفع عند الاستلام.',scam:1,lever:'greed',tell:'سعر خيالي وتحويل مسبق لرقم شخصي بدون دفع عند الاستلام.',right:'اشترِ من متجر معروف يقبل الدفع عند الاستلام أو عبر بوابة دفع رسمية.'},
{id:'n7',ch:'wa',from:'المدير العام',sub:'رقم جديد',ctx:'<b>الموقف:</b> وصلت هالرسالة لموظفة الحسابات في شركتكم، وتسألك رأيك.',body:'أنا في اجتماع وما أقدر أرد. [[حوّل 1,800 د.ك للمورّد الحين]] على هالآيبان و[[لا تكلم أحد]]، أشرح لك بعدين.',insp:'ليس رقم المدير المعروف، والآيبان لمورّد لم تتعامل معه الشركة من قبل.',scam:1,lever:'authority',tell:'أمر تحويل عاجل وسرّي من رقم جديد. هذا احتيال «المدير المزيف».',right:'تأكد من المدير بمكالمة على رقمه المعروف، واتبع إجراءات الشركة.'},
{id:'n6',ch:'wa',from:'سالم (ربيع الدوام)',sub:'رقم محفوظ',ctx:'<b>الموقف:</b> دفعت أمس قطية العشا عن الشباب.',body:'عطني رقم الآيبان مالك أحوّل لك نصيبي من القطية 🍽',insp:'الآيبان يُستخدم للإيداع فقط، وسالم رقمه محفوظ والسياق معروف.',scam:0,ok:'الآيبان وحده لا يسمح بالسحب، والطلب من شخص معروف في سياق مفهوم.'},

{id:'i1',ch:'life',from:'زميلك في الدوام',sub:'عند مكتبك',body:'«أنا مستعجل وإنت طالع. [[عطني الباسورد مالك]] أخلّص المعاملة من جهازك وأسكّره.»',insp:'أي عملية بحسابك تُسجَّل باسمك أنت، حتى لو نفّذها غيرك.',scam:1,lever:'trust',tell:'كلمة السر لا تُعطى لأحد، حتى لزميل تثق به. ما يُفعل بحسابك يُحسب عليك.',right:'اعتذر، وليدخل بحسابه هو أو يطلب صلاحية رسمية.'},
{id:'i2',ch:'notif',from:'تطبيق البنك',sub:'داخل التطبيق',body:'احمِ حسابك: فعّل الدخول ببصمة الوجه والتحقق بخطوتين من الإعدادات.',insp:'اقتراح داخل التطبيق الرسمي نفسه، والتفعيل من إعداداته.',scam:0,yes:'أفعّلها',ok:'التحقق بخطوتين من داخل التطبيق الرسمي يصعّب سرقة حسابك حتى لو تسرّبت كلمة السر.'},
{id:'i3',ch:'pop',from:'تحذير أمني!',sub:'نافذة ظهرت في المتصفح',body:'[[جهازك مصاب بـ 5 فيروسات!]] نزّل برنامج التنظيف خلال [[60 ثانية]] قبل فقدان بياناتك.',insp:'النافذة من موقع إعلانات، وليست من نظام الجوال ولا من متجر التطبيقات.',scam:1,lever:'fear',tell:'المواقع لا تستطيع فحص جهازك. النافذة تريدك أن تنزّل برنامجًا خبيثًا.',right:'أغلق الصفحة، ولا تنزّل تطبيقات إلا من المتجر الرسمي.'},
{id:'i4',ch:'pop',from:'Free_Mall_WiFi',sub:'شبكة واي فاي مفتوحة',body:'للاتصال بالإنترنت المجاني [[سجّل الدخول ببريدك وكلمة السر]].',insp:'شبكة بلا قفل، واسمها لا يطابق اسم شبكة المجمّع المعلن عند الاستعلامات.',scam:1,lever:'greed',tell:'شبكة مجانية تطلب كلمة سر بريدك. الشبكة الحقيقية لا تحتاجها، ومن يملك بريدك يقدر يغيّر كلمات سر حساباتك كلها.',right:'استخدم بيانات جوالك للعمليات البنكية، ولا تُدخل كلمات السر في شبكة عامة.'},
{id:'i5',ch:'notif',from:'نظام الجوال',sub:'الإعدادات',body:'تحديث أمني جديد للنظام متوفر. يمكنك تثبيته من الإعدادات > تحديث النظام.',insp:'إشعار من النظام نفسه، والتحديث من الإعدادات وليس من رابط.',scam:0,yes:'أحدّث',ok:'تحديثات النظام من الإعدادات تسد الثغرات. تأجيلها يترك جهازك مكشوفًا.'},
{id:'i6',ch:'pop',from:'تطبيق «كشّاف برو»',sub:'طلب صلاحيات',body:'ليعمل الكشّاف يحتاج التطبيق إلى: [[قراءة الرسائل النصية]]، [[جهات الاتصال]]، والميكروفون.',insp:'كشّاف لا يحتاج إلا الكاميرا. قراءة الرسائل تعني قراءة رموز التحقق.',scam:1,lever:'greed',tell:'صلاحيات لا علاقة لها بوظيفة التطبيق. من يقرأ رسائلك يقرأ رموز البنك.',right:'ارفض الصلاحيات واحذف التطبيق.'},
{id:'i7',ch:'mail',from:'الدعم التقني',sub:'it-support@mail-secure.co',body:'كلمة سر بريدك [[ستنتهي خلال ساعتين]]. للاحتفاظ بها سجّل دخولك هنا: [[{{mail-login-secure.co}}]]',insp:'عنوان المرسل ليس نطاق جهة عملك، والرابط يقود إلى صفحة دخول مقلَّدة.',scam:1,lever:'urgency',tell:'مهلة قصيرة ورابط دخول من نطاق غريب. هذا تصيّد لكلمة السر.',right:'لا تدخل من الرابط. غيّر كلمة السر من الموقع الرسمي إن أردت، وبلّغ قسم التقنية.'},
{id:'i8',ch:'notif',from:'مدير كلمات المرور',sub:'في جوالك',body:'اقتراح: كلمة سر قوية ومختلفة لهذا الموقع، تُحفظ عندك تلقائيًا.',insp:'ميزة مدمجة في نظام الجوال، محمية ببصمتك.',scam:0,yes:'أستخدمها',ok:'كلمة سر مختلفة لكل موقع تمنع تسرّب واحد من فتح كل حساباتك.'},
{id:'i9',ch:'life',from:'فلاش في المواقف',sub:'مكتوب عليه «رواتب 2026»',body:'لقيت فلاش USB مكتوب عليه «رواتب 2026» عند سيارتك في مواقف الدوام. [[تشبكه بالكمبيوتر وتشوف؟]]',insp:'رمي فلاشات ملغومة في المواقف حيلة معروفة لاختراق الشركات.',scam:1,lever:'greed',tell:'الفلاش المجهول قد يحمل برنامجًا يشتغل فور توصيله.',right:'لا توصله بأي جهاز، وسلّمه لقسم التقنية.'},

{id:'n8',ch:'social',from:'عملة «دانة كوين»',sub:'فيديو ترويجي',body:'🚀 العملة الكويتية الجديدة! [[اشترِ قبل الإدراج وتضاعف 50 مرة]]. المشاهير كلهم دخلوا، [[الفرصة تنتهي الليلة]].',insp:'لا يوجد فريق معروف ولا ترخيص، والموقع أُنشئ قبل أسبوع.',scam:1,lever:'greed',tell:'وعد بمضاعفة خيالية ومهلة تنتهي الليلة. أصحاب العملة يبيعون ويختفون.',right:'تجاهل. لا تضع مالًا في شيء لا تفهمه ولا ترخّصه جهة رقابية.'},
{id:'n9',ch:'wa',from:'بنت خالتك',sub:'رقم محفوظ',body:'مشروع يغير حياتك! [[ادفع 50 د.ك اشتراك وييب 3 أشخاص]] وكل واحد ييب 3، وتوصل 1,000 بالشهر 🤑',insp:'لا يوجد منتج حقيقي. الربح كله من اشتراكات القادمين الجدد.',scam:1,lever:'greed',tell:'الربح يأتي من جلب مشتركين لا من بيع منتج. هذا تسويق هرمي ينهار على آخر الداخلين.',right:'اعتذر ونبّه قريبتك. حتى القريب قد يكون ضحية يروّج دون علم.'},
{id:'n12',ch:'call',from:'مكتب استرداد الأموال',sub:'+965 2••• ••12',ctx:'<b>الموقف:</b> خسرت قبل شهر 200 د.ك في موقع وهمي.',body:'عرفنا إنك تعرضت للاحتيال. نقدر [[نرجّع لك فلوسك كاملة]]، بس [[ادفع 40 د.ك رسوم فتح الملف]] أول.',insp:'لا جهة رسمية تطلب رسومًا لاسترداد أموالك. قائمة الضحايا تُباع بين المحتالين.',scam:1,lever:'greed',tell:'من وقع مرة يُستهدف مرة ثانية بوعد «استرداد» مقابل رسوم.',right:'الاسترداد يكون عبر بنكك والجهات الرسمية فقط، وبلا رسوم مسبقة.'},
{id:'n10',ch:'notif',from:'تطبيق البنك',sub:'داخل التطبيق',body:'وديعة ثابتة لمدة سنة بعائد سنوي 4%. الشروط كاملة في التطبيق أو في أقرب فرع.',insp:'عرض داخل التطبيق الرسمي، بعائد واقعي وشروط مكتوبة.',scam:0,ok:'عائد واقعي من جهة مرخّصة وبشروط مكتوبة، بلا استعجال ولا وعد بثراء.'},
{id:'n11',ch:'wa',from:'أخوك الكبير',sub:'رقم محفوظ',body:'قبل ما تحط فلوسك بأي مكان، اسأل البنك عن الصناديق المرخّصة واقرأ النشرة. لا تستعجل.',insp:'نصيحة بلا رابط ولا طلب تحويل.',scam:0,ok:'نصيحة تدعوك للتأكد والتمهّل، وهذا عكس ما يفعله المحتال.'},
/* -- غسيل الأموال -- */
{id:'m1',ch:'wa',from:'وكيل تحويلات دولية',sub:'+44 7••• ••2210',body:'شغل سهل من البيت: نحوّل لحسابك 2,000 د.ك، [[تاخذ 100 عمولة وتحوّل الباقي]] على حساب ثاني. بدون خبرة.',insp:'لا عقد ولا شركة. المال الذي سيدخل حسابك مسروق من ضحية أخرى.',scam:1,lever:'greed',tell:'استقبال مال وتمريره مقابل عمولة يجعلك «ناقل أموال» في غسيل أموال، حتى لو لم تكن تعلم.',right:'ارفض وبلّغ. حسابك لك وحدك.',acts:[['أرفض وأبلّغ البنك عن الرسالة',2,'بالضبط. تمرير الأموال مقابل عمولة غسيل أموال، والتبليغ يحمي غيرك.'],['أسأل عن العقد والشركة أول',1,'التفاصيل ما تغيّر شي: أي عقد يطلب منك تمرير أموال غطاء لغسيلها.'],['أجرب مرة وحدة وأشوف',0,'مرة وحدة تكفي تخليك متهم بغسيل أموال، حتى لو ما كنت تدري.']]},
{id:'m2',ch:'life',from:'ربيعك',sub:'في الديوانية',body:'«[[أجّر لي حسابك البنكي شهر واحد]] وأعطيك 150 د.ك. حسابي موقوف وعندي شغل بسيط بس.»',insp:'كل ما يمر في حسابك مسؤوليتك القانونية أنت.',scam:1,lever:'trust',tell:'تأجير الحساب جريمة. إن مرّت فيه أموال مشبوهة فأنت المتهم الأول.',right:'ارفض بوضوح، حتى مع صديق.',acts:[['أرفض بوضوح حتى لو ربيعي',2,'صح. الحساب مسؤوليتك القانونية، والصداقة ما تحميك.'],['أنصحه يراجع البنك عن حسابه الموقوف',1,'نصيحة طيبة، بس لازم ترفض طلبه بوضوح أول.'],['أعطيه شهر واحد بس',0,'شهر واحد يكفي تمر فيه أموال مشبوهة باسمك، وأنت المتهم الأول.']]},
{id:'m3',ch:'wa',from:'+965 6••• ••84',sub:'رقم غير محفوظ',ctx:'<b>الموقف:</b> وصلك للتو تحويل 300 د.ك من مجهول.',body:'السلام عليكم، حوّلت لك 300 بالغلط 😢 [[رجّعهم لي على هالحساب الثاني]] الله يخليك، مستعجل.',insp:'يطلب الإرجاع إلى حساب غير الحساب الذي جاء منه التحويل.',scam:1,lever:'urgency',tell:'الإرجاع إلى حساب مختلف يجعلك حلقة في تمرير أموال مسروقة.',right:'لا تحوّل بنفسك. بلّغ بنكك وهو يعيد المبلغ لمصدره.',acts:[['أبلّغ البنك وهو يرجّع المبلغ لمصدره',2,'بالضبط. البنك يتتبع التحويل ويرجّعه للحساب اللي جا منه.'],['أرجّعه بنفسي لنفس الحساب اللي جا منه',1,'أحسن من الحساب الثاني، بس الأسلم البنك يتولى الإرجاع.'],['أحوّله للحساب الثاني مثل ما طلب',0,'كذا تصير حلقة في تمرير أموال مسروقة.']]},
{id:'m4',ch:'life',from:'موظف الفرع',sub:'وأنت داخل البنك',body:'«نحتاج نحدّث بياناتك: جهة العمل ومصدر الدخل. هذا إجراء دوري لكل العملاء.»',insp:'أنت داخل الفرع الرسمي، والأسئلة عن العمل والدخل وليست عن أرقام سرية.',scam:0,yes:'أحدّث بياناتي',ok:'تحديث «اعرف عميلك» داخل الفرع واجب على البنك لمكافحة غسيل الأموال، ولا يُطلب فيه أي رقم سري.'},
{id:'m5',ch:'call',from:'رجل أعمال',sub:'تعرّفت عليه أونلاين',body:'أبي أفتح شركة بالكويت. [[افتح حساب باسمك وأنا أديره]]، مجرد توقيع ولك 500 د.ك شهريًا.',insp:'لا تعرف نشاطه الحقيقي، والحساب سيكون باسمك أنت أمام القانون.',scam:1,lever:'greed',tell:'حساب باسمك يديره غيرك غطاء معروف لغسيل الأموال.',right:'ارفض. لا تفتح حسابًا لغيرك ولا توقّع عن أحد.',acts:[['أرفض وأقطع التواصل',2,'صح. حساب باسمك يديره غيرك غطاء معروف لغسيل الأموال.'],['أطلب منه عقد مكتوب أول',0,'العقد ما يحميك: الحساب باسمك وأنت المسؤول عن كل ما يمر فيه.'],['أفتحه وأراقب الحساب بنفسي',0,'ما راح تقدر توقف شي. أي جريمة تمر فيه تُسجّل عليك.']]},
{id:'m6',ch:'notif',from:'تطبيق البنك',sub:'إشعار من التطبيق',ctx:'<b>الموقف:</b> أخوك وعدك يرجّع لك قطية الغدا.',body:'وصلك تحويل بمبلغ 12.000 د.ك من أخيك. الملاحظة: «قطية الغدا».',insp:'مبلغ متوقع من شخص تعرفه ولسبب تعرفه.',scam:0,ok:'تحويل متوقع، من شخص معروف، ولسبب واضح. هذا هو الاستخدام الطبيعي للحساب.'},
{id:'m7',ch:'social',from:'نشتري_بطاقات',sub:'رسالة خاصة',body:'نشتري [[بطاقة الصراف مع الرقم السري]] بـ 50 د.ك، وشريحة باسمك بـ 20. استلام فوري 💵',insp:'البطاقة والشريحة ستُستخدمان في جرائم مسجّلة باسمك.',scam:1,lever:'greed',tell:'بيع بطاقتك أو شريحتك يعني أن كل جريمة تُرتكب بهما تُنسب إليك.',right:'تجاهل وبلّغ عن الحساب.',acts:[['أتجاهله وأبلّغ عن الحساب',2,'صح. التبليغ يوقفه عن غيرك.'],['أرد أسأله عن التفاصيل',1,'ما بعت شي، بس الرد يفتح له باب يضغط عليك. تجاهل وبلّغ.'],['أبيع الشريحة بس، البطاقة لا',0,'الشريحة باسمك، وأي جريمة تُرتكب فيها تُنسب لك.']]},
{id:'m8',ch:'call',from:'البنك',sub:'الرقم المحفوظ في جهات الاتصال',ctx:'<b>الموقف:</b> بعت سيارتك أمس ووصلك ثمنها 5,000 د.ك.',body:'معاك البنك. وصل حسابك تحويل كبير أمس، ممكن نعرف مصدره؟ يكفي تجاوب، وما نحتاج أي رمز أو رقم سري.',insp:'يسأل عن مصدر مبلغ وصلك فعلًا، ولا يطلب أي سر.',scam:0,soft:1,yes:'أوضّح المصدر',ok:'سؤال البنك عن مصدر مبلغ كبير إجراء قانوني لمكافحة غسيل الأموال. ولو شككت، أغلق واتصل بالبنك بنفسك.'},
/* -- الذكاء الاصطناعي -- */
{id:'a1',ch:'wa',from:'+965 5••• ••09',sub:'مقطع صوتي بصوت ولدك',body:'🎤 «يبه سويت حادث وجوالي انكسر. [[محتاج 400 د.ك الحين]] على هالحساب، [[ولا تقول لأحد]].» الصوت صوته تمامًا.',insp:'رقم غير محفوظ. عشر ثوانٍ من صوته في مقطع منشور تكفي لتقليده.',scam:1,lever:'trust',tell:'الصوت لم يعد دليلًا. الذكاء الاصطناعي يقلّده من مقطع قصير.',right:'اتصل على رقمه المعروف، أو اسأله عن كلمة سر العائلة.'},
{id:'a2',ch:'social',from:'مقطع متداول',sub:'فيديو لشخصية مشهورة',body:'شخصية معروفة تقول بالفيديو: «[[استثمرت بهالمنصة وربحت 20 ألف بشهر]]، سجّلوا من الرابط». ',insp:'حركة الشفايف ما تطابق الكلام تمامًا، والحساب الرسمي للشخصية لم ينشر المقطع، والرابط لموقع عمره أيام.',scam:1,lever:'authority',tell:'فيديو مزيّف بوجه مشهور للترويج لمنصة وهمية.',right:'تحقق من الحساب الرسمي للشخصية، ولا تسجّل من روابط المقاطع.'},
{id:'a3',ch:'call',from:'مكالمة فيديو · موظف البنك',sub:'رقم غير محفوظ',body:'يظهر وجه بزيّ رسمي وخلفه شعار. الصورة [[تتقطع والوجه ثابت بشكل غريب]]. يقول: «[[شارك شاشتك]] عشان نأمّن حسابك.»',insp:'البنك لا يطلب منك مشاركة شاشتك أبدًا، لا بمكالمة فيديو ولا بغيرها.',scam:1,lever:'authority',tell:'وجه مولَّد بالذكاء الاصطناعي، وطلب مشاركة الشاشة يكشف تطبيق البنك ورموزك.',right:'أغلق المكالمة واتصل بالبنك من الرقم خلف البطاقة.'},
{id:'a4',ch:'social',from:'مها ✨',sub:'تعرّفت عليها قبل أسبوعين',body:'حبيبي اشتريت لك هدية بس [[حجزوها بالجمارك]] 😢 [[حوّل لي 120 د.ك]] أطلّعها وأرجّعهم لك أول ما نتقابل.',insp:'صورها مثالية بلا أي صورة عفوية، وترفض مكالمة الفيديو دائمًا.',scam:1,lever:'trust',tell:'شخصية بصور مولَّدة تبني علاقة ثم تطلب مالًا. لم تلتقِ بها أبدًا.',right:'لا ترسل مالًا لمن لم تقابله، واقطع التواصل.'},
{id:'a5',ch:'sms',from:'البنـك',sub:'رسالة نصية',body:'حرصًا على أمان حسابك، نرجو [[توثيق بصمة الوجه]] خلال 24 ساعة عبر الرابط: [[{{face-verify-kw.app}}]]',insp:'صياغة متقنة بلا أي خطأ، لكن اسم المرسل فيه مدّة زائدة والرابط ليس للبنك.',scam:1,lever:'fear',tell:'الإتقان اللغوي لم يعد علامة أمان. المحتال يكتب بالذكاء الاصطناعي. انظر إلى الرابط والطلب.',right:'توثيق الوجه يكون داخل تطبيق البنك فقط.'},
{id:'a6',ch:'pop',from:'المساعد الذكي للبنك',sub:'دردشة في موقع ظهر لك بالبحث',body:'أهلًا! أنا المساعد الذكي 🤖 للتحقق من هويتك [[أدخل رقم البطاقة ورمز التحقق]] الذي سيصلك الآن.',insp:'الموقع ظهر كإعلان في نتائج البحث، وعنوانه ليس عنوان البنك.',scam:1,lever:'authority',tell:'روبوت دردشة في موقع مقلَّد. حتى الآلة لا يحق لها طلب رمز التحقق.',right:'ادخل موقع البنك من التطبيق أو بكتابة العنوان بنفسك.'},
{id:'a9',ch:'pop',from:'تطبيق «جمّل صورتك AI»',sub:'شاشة التسجيل',body:'للتأكد من عمرك [[ارفع صورة بطاقتك المدنية وسيلفي]] ثم استمتع بالفلاتر مجانًا.',insp:'تطبيق صور لا يحتاج هويتك. الصورة والهوية تكفيان لفتح حسابات باسمك.',scam:1,lever:'greed',tell:'الهوية مع السيلفي تُستخدمان لانتحال شخصيتك وفتح حسابات باسمك.',right:'لا ترفع هويتك إلا لجهة رسمية تعرفها.'},
{id:'a7',ch:'call',from:'أخوك',sub:'مكالمة فيديو من رقمه المحفوظ',ctx:'<b>الموقف:</b> سألته عن كلمة سر العائلة فأجاب صح.',body:'«تطمّن، أنا. أبي منك رقم المطعم اللي رحنا له الأسبوع اللي طاف.»',insp:'رقمه المحفوظ، وأجاب عن كلمة السر، والطلب عادي بلا مال.',scam:0,ok:'رقم معروف، وكلمة سر العائلة صحيحة، وطلب عادي. كلمة السر العائلية تهزم الصوت والوجه المقلَّدين.'},
{id:'a8',ch:'notif',from:'تطبيق البنك',sub:'عند فتح التطبيق',body:'انظر إلى الكاميرا لتسجيل الدخول ببصمة الوجه.',insp:'يحدث داخل التطبيق الرسمي على جوالك عند فتحه.',scam:0,yes:'أسجّل الدخول',ok:'بصمة الوجه داخل التطبيق الرسمي على جهازك آمنة. الخطر حين يُطلب وجهك عبر رابط.'},
{id:'a10',ch:'social',from:'حساب البنك الموثّق',sub:'منشور',body:'تنبيه: تنتشر مقاطع مزيفة بالذكاء الاصطناعي تنتحل البنك. لا نطلب بياناتك عبر المقاطع أو الروابط.',insp:'الحساب الموثّق الذي تتابعه من سنوات، والمنشور لا يطلب شيئًا.',scam:0,ok:'منشور توعوي من الحساب الرسمي، لا يطلب شيئًا ولا يحمل رابطًا.'},
/* -- سرية العملاء والإفصاح -- */
{id:'c1',ch:'call',from:'خدمة العملاء',sub:'+965 2••• ••51',body:'معاك البنك. للتأكد من هويتك [[كم رصيدك الحالي وآخر ثلاث عمليات]]؟ و[[شنو الرقم السري]] للخدمة الهاتفية؟',insp:'البنك يعرف رصيدك وعملياتك، ولا يسألك عنها حين يتصل هو.',scam:1,lever:'authority',tell:'من يتصل بك لا يحق له أن يسألك عن رصيدك أو رقمك السري. هذه معلوماتك السرية.',right:'أغلق واتصل أنت بالبنك.'},
{id:'c2',ch:'life',from:'معرفة يشتغل في بنك',sub:'في جمعة',body:'«إذا تبي، [[أطلّع لك كشف حساب أي شخص تعرفه]] وتشوف وين يصرف. ما أحد راح يدري.»',insp:'إفشاء بيانات عميل جريمة على الموظف ومن يطلبها.',scam:1,lever:'trust',tell:'سرية حسابات العملاء محمية بالقانون. كما لا تريد أن يُكشف حسابك، لا تطلب كشف حساب غيرك.',right:'ارفض. وإن فعلها معك فسيفعلها بك.'},
{id:'c3',ch:'life',from:'موظف الفرع',sub:'وأنت داخل البنك',ctx:'<b>الموقف:</b> طلبت كشف حسابك.',body:'«قبل ما أطبع الكشف، ممكن البطاقة المدنية الأصلية؟»',insp:'التحقق من هويتك قبل تسليم بياناتك يحميك أنت.',scam:0,yes:'أعطيه البطاقة',ok:'التحقق من الهوية داخل الفرع قبل الإفصاح عن بياناتك هو تطبيق السرية لمصلحتك.'},
{id:'c4',ch:'life',from:'موظف معرض سيارات',sub:'عند توقيع التقسيط',body:'«عشان نسرّع الموافقة، [[سجّل دخولك بتطبيق البنك على جهازنا]] ونصوّر كشف الحساب.»',insp:'جهاز لا تملكه قد يحفظ اسم المستخدم وكلمة السر.',scam:1,lever:'urgency',tell:'تسجيل الدخول على جهاز غيرك يكشف حسابك كله ويترك بياناتك عندهم.',right:'اطلب كشفًا رسميًا من بنكك وسلّمه بنفسك.'},
{id:'c5',ch:'notif',from:'تطبيق البنك',sub:'طلب موافقة',ctx:'<b>الموقف:</b> قدّمت على تمويل من شركة.',body:'شركة التمويل تطلب الاطلاع على بياناتك الائتمانية. هل توافق؟ يمكنك الرفض.',insp:'طلب موافقة داخل التطبيق الرسمي، مرتبط بطلب قدّمته أنت.',scam:0,yes:'أوافق',ok:'لا تُشارك بياناتك مع طرف ثالث إلا بموافقتك. طلب الموافقة هو السرية وهي تعمل.'},
{id:'c6',ch:'wa',from:'استبيان رضا العملاء',sub:'+965 9••• ••70',body:'شاركنا رأيك واربح قسيمة 10 د.ك 🎁 فقط أكّد: [[الرقم المدني، رقم الحساب، تاريخ الميلاد]].',insp:'الاستبيان الحقيقي يسأل عن رأيك، لا عن بياناتك.',scam:1,lever:'greed',tell:'بياناتك الشخصية هي المطلوب، والقسيمة طُعم. بهذه البيانات يُنتحل اسمك عند البنك.',right:'لا تعطِ بياناتك عبر الرسائل.'},
{id:'c7',ch:'social',from:'ستوري جاهزة للنشر',sub:'حسابك أنت',body:'صوّرت بطاقتك البنكية اليديدة 💳 والكاميرا [[طالع فيها رقم البطاقة وتاريخها]]. تنشر؟',insp:'رقم البطاقة والتاريخ يكفيان للشراء من كثير من المواقع.',scam:1,lever:'trust',tell:'أنت أول من يحفظ سرية بياناتك. صورة واحدة تكفي لاستخدام بطاقتك.',right:'لا تنشر صور البطاقات ولا كشوف الحساب ولا تذاكر السفر.'},
{id:'c8',ch:'mail',from:'البنك',sub:'كتاب رسمي',body:'نحيطكم علمًا بأنه تم تزويد المحكمة ببيانات حسابكم بناءً على أمر قضائي رقم 1482. للاستفسار راجعوا الفرع.',insp:'إشعار بلا رابط ولا طلب، ويدعوك لمراجعة الفرع.',scam:0,ok:'السرية المصرفية لها استثناءات قانونية محددة، منها أمر القضاء. والبنك يبلغك ولا يطلب منك شيئًا.'},
{id:'c9',ch:'call',from:'شركة المعلومات الائتمانية',sub:'+965 2••• ••63',body:'تصنيفك الائتماني نزل. نقدر نرفعه اليوم، بس [[عطنا اسم المستخدم وكلمة السر لتطبيق البنك]] نراجع حسابك.',insp:'لا جهة رسمية تطلب كلمة سر تطبيقك لأي سبب.',scam:1,lever:'fear',tell:'لا أحد غيرك يحق له معرفة كلمة سر تطبيق البنك، مهما كانت الجهة.',right:'أغلق، وراجع تصنيفك من القنوات الرسمية بنفسك.'},
/* -- المواجهة الأخيرة -- */
{id:'b1',ch:'call',from:'+965 5••• ••38',sub:'رقم غير محفوظ',ctx:'<b>الموقف:</b> وصلك للتو رمز تحقق لعملية 399 د.ك لم تقم بها.',body:'ألو، آسف! كتبت رقمك بالغلط و[[وصلك رمزي]]. [[ممكن تقراه لي]]؟ ثواني بس.',insp:'الرمز مربوط ببطاقتك أنت، والعملية شراء بـ 399 د.ك.',scam:1,lever:'urgency',tell:'الرمز لم يصلك بالغلط. هو يملك رقم بطاقتك وينقصه الرمز فقط.',right:'لا تقرأ الرمز لأحد، واتصل بالبنك فورًا لإيقاف البطاقة.'},
{id:'b2',ch:'call',from:'مندوب التوصيل',sub:'+965 6••• ••91',ctx:'<b>الموقف:</b> تنتظر طلبية اليوم، ووصلتك للتو رسالة من البنك فيها رمز لعملية بـ 120.000 د.ك.',body:'أنا تحت البيت. النظام يطلب تأكيد: [[بيوصلك رمز، عطني إياه]] وأسلّمك الطلب.',insp:'رمز الاستلام يظهر في تطبيق المتجر، ولا يصل من البنك.',scam:1,lever:'urgency',tell:'استغل أنك تنتظر طلبية فعلًا. الرمز الذي سيصلك رمز بنكي وليس رمز استلام.',right:'اقرأ الرسالة جيدًا: إن كانت من البنك فلا تُعطِ الرمز لأحد.'},
{id:'b4',ch:'sms',from:'البنـك',sub:'رسالة نصية',body:'ضمن حملة لنكن على دراية: [[فعّل خدمة الحماية من الاحتيال]] الآن عبر: [[{{daraya-protect.kw-secure.net}}]]',insp:'اسم المرسل فيه مدّة زائدة، والرابط ليس موقع البنك.',scam:1,lever:'authority',tell:'المحتال يلبس ثوب حملة التوعية نفسها. العلامة هي الرابط والمرسل المقلَّد.',right:'أي خدمة حماية تُفعَّل من داخل تطبيق البنك.'},
{id:'b8',ch:'wa',from:'مسابقة لنكن على دراية',sub:'+965 9••• ••02',body:'جاوب على 3 أسئلة عن الاحتيال واربح 50 د.ك 🎉 [[أدخل بيانات بطاقتك لاستلام الجائزة]].',insp:'الجائزة تُحوَّل على الآيبان، ولا تحتاج بيانات البطاقة.',scam:1,lever:'greed',tell:'استلام أي مبلغ لا يحتاج بيانات بطاقتك، حتى لو كان الاسم اسم حملة توعية.',right:'تجاهل وبلّغ. الجوائز الحقيقية تُعلن في القنوات الرسمية.'},
{id:'b9',ch:'sms',from:'البنك',sub:'رسالة نصية',ctx:'<b>الموقف:</b> دفعت قبل دقيقة في الجمعية.',body:'تم خصم 4.250 د.ك من بطاقتك المنتهية بـ 4410 لدى الجمعية التعاونية.',insp:'يطابق مشترياتك قبل دقيقة، بلا رابط ولا طلب.',scam:0,ok:'إشعار يطابق عملية قمت بها أنت، ولا يطلب شيئًا.'}
);

{id:'j1',ch:'game',from:'SkinMaster_KW',sub:'لاعب في «بلوكس لاند»',body:'عندي سكن نادر 🔥 أعطيك إياه ببلاش، بس [[سجّل دخولك من هالرابط]] {{blox-skins-free.co}}',insp:'الرابط ليس موقع اللعبة الرسمي، والحساب أُنشئ أمس.',scam:1,lever:'greed',tell:'صفحة دخول مزيفة تسرق حسابك. الهدايا الحقيقية تصل داخل اللعبة بلا روابط.',right:'لا تفتح الرابط. بلوك وتبليغ، وأخبر أهلك.'},
{id:'j2',ch:'game',from:'سعود_77',sub:'صديق في اللعبة من شهر',body:'خلنا نتبادل الحسابات يوم واحد بس 😁 [[عطني كلمة السر مالك]] وأعطيك مالي.',insp:'لا أحد يحتاج كلمة سرك ليلعب معك.',scam:1,lever:'trust',tell:'كلمة السر مثل مفتاح البيت، لا تُعطى حتى للأصدقاء.',right:'ارفض بلطف، وغيّر كلمة السر إذا أعطيتها لأحد.'},
{id:'j3',ch:'social',from:'يوتيوبر الألعاب',sub:'تعليق مثبّت',body:'سحب على جهاز ألعاب 🎮 [[اكتب رقم جوال أمك وتاريخ ميلادها]] في التعليقات!',insp:'الحساب نسخة من حساب مشهور، واسمه فيه حرف زيادة.',scam:1,lever:'greed',tell:'بيانات أهلك تُستخدم لسرقة حساباتهم. لا سحب يحتاجها.',right:'لا تكتب أي بيانات، وبلّغ عن التعليق.'},
{id:'j4',ch:'social',from:'حساب مجهول',sub:'رسالة خاصة',body:'عندي صورك 😈 [[أرسل لي كود بطاقة هدايا]] وإلا بنشرها للكل.',insp:'حساب بلا صور ولا متابعين، أُنشئ اليوم.',scam:1,lever:'fear',tell:'التهديد هدفه يخوّفك فتسكت، والدفع يجيب طلبات أكثر.',right:'لا ترد ولا تدفع. صوّر الرسالة وأخبر أهلك فورًا.'},
{id:'j5',ch:'pop',from:'مبروك!',sub:'نافذة ظهرت فجأة',body:'أنت الزائر رقم 1,000,000 🎉 [[اكتب اسمك وعنوان بيتكم]] لتستلم جوالًا جديدًا.',insp:'النافذة ظهرت في موقع ألعاب لا علاقة له بأي مسابقة.',scam:1,lever:'greed',tell:'لا جائزة تطلب عنوان بيتك من نافذة منبثقة.',right:'سكّر النافذة ولا تكتب شيئًا.'},
{id:'j6',ch:'game',from:'Moderator_Team',sub:'رسالة داخل اللعبة',body:'حسابك مبلّغ عليه ⚠️ [[أرسل لنا رمز التحقق اللي بيوصلك]] عشان ما ينحذف.',insp:'فريق اللعبة الرسمي لا يراسلك من حساب لاعب.',scam:1,lever:'authority',tell:'رمز التحقق يفتح حسابك لمن يأخذه. لا أحد رسمي يطلبه.',right:'لا ترسل الرمز، وبلّغ عن الحساب.'},
{id:'j7',ch:'wa',from:'+965 6••• ••45',sub:'يقول إنه يوسف من صفك',body:'هلا، وصلك كود من 6 أرقام بالغلط على رقمك، [[ممكن ترسله لي؟]] 🙏',insp:'رقم غير محفوظ، ويوسف رقمه عندك.',scam:1,lever:'trust',tell:'الكود وصلك أنت لأن أحدًا يحاول يدخل حسابك.',right:'لا ترسله. اتصل بيوسف على رقمه المحفوظ.'},
{id:'j8',ch:'social',from:'لولو_13',sub:'تقول إن عمرها 13',body:'شكلك لطيف 😊 خلنا [[نكلم بعض بتطبيق ثاني ولا تقول لأهلك]].',insp:'صور الحساب منسوخة من الإنترنت.',scam:1,lever:'trust',tell:'«لا تقول لأهلك» أكبر علامة. الصديق الحقيقي لا يطلب أسرارًا.',right:'لا تنتقل لتطبيق آخر. أخبر أهلك وبلّغ عن الحساب.'},
{id:'j9',ch:'game',from:'GemHacker',sub:'رسالة في الدردشة',body:'جواهر بلا حدود 💎 [[نزّل البرنامج المساعد]] {{gem-hack.apk}}',insp:'الملف ليس من المتجر الرسمي.',scam:1,lever:'greed',tell:'برامج «الهاك» تسرق حسابك أو تتجسس على الجهاز.',right:'لا تنزّل أي ملف من خارج المتجر.'},
{id:'j10',ch:'call',from:'المدرسة',sub:'+965 2••• ••31',body:'معاك المدرسة. أبوك طلب نأكد بياناته، [[قول لي الأرقام اللي على بطاقة البنك]].',insp:'المدرسة لا تحتاج بطاقة البنك، وتتصل بأهلك لا بك.',scam:1,lever:'authority',tell:'لا جهة تطلب أرقام البطاقة من طفل.',right:'سكّر وأخبر أهلك.'},
{id:'j11',ch:'sms',from:'GameStore',sub:'رسالة نصية',body:'فزت بقسيمة 20 د.ك لمتجر الألعاب 🎁 [[ادخل رقم بطاقة الوالد]] للتفعيل: {{gamestore-gift.co}}',insp:'الرابط ليس المتجر الرسمي.',scam:1,lever:'greed',tell:'القسيمة المجانية لا تحتاج بطاقة أحد.',right:'لا تفتح الرابط، وأرِ الرسالة لأهلك.'},
{id:'j12',ch:'life',from:'شخص في المجمّع',sub:'غريب',body:'«عطني جوالك أكلم أمي، جوالي خلص شحن» [[ويبي يبعد فيه شوي]].',insp:'يريد أن يأخذ الجوال بعيدًا عنك.',scam:1,lever:'trust',tell:'جوالك فيه حساباتك وصور أهلك، ولا يُعطى لغريب.',right:'دلّه على الأمن أو المحل، أو اتصل أنت وهو بجانبك.'},
{id:'j13',ch:'social',from:'#تحدي_البطاقة',sub:'ترند',body:'التحدي الجديد 🔥 [[صوّر بطاقة البنك مال أهلك وانشرها]] قبل نص الليل!',insp:'أرقام البطاقة تظهر واضحة في الصور.',scam:1,lever:'urgency',tell:'أي صورة لبطاقة بنك يمكن أن يستخدمها أحد للشراء.',right:'لا تشارك. بعض التحديات فخ.'},
{id:'j14',ch:'wa',from:'+965 5••• ••52',sub:'مقطع صوتي بصوت أمك',body:'🎤 «حبيبي أنا ماما، جوالي ضاع. [[صوّر لي بطاقة البنك اللي بالدرج]] بسرعة.»',insp:'رقم جديد، والصوت يشبه صوتها لكن بلا اسم الدلع الذي تعرفه.',scam:1,lever:'trust',tell:'الذكاء الاصطناعي يقلّد الأصوات. تأكد قبل أي طلب.',right:'اتصل على رقم أمك المحفوظ أو اسأل أحدًا في البيت.'},
{id:'j15',ch:'social',from:'فيديو لمشهور',sub:'مقطع متداول',body:'يوتيوبر مشهور يقول: «[[ادخلوا الرابط واربحوا 1000 جوهرة]]». فمه يتحرك بشكل غريب.',insp:'الحساب ليس الحساب الموثّق للمشهور.',scam:1,lever:'authority',tell:'فيديوهات مزيفة بالذكاء الاصطناعي تستخدم وجوه المشاهير.',right:'لا تدخل الرابط. تأكد من حسابه الرسمي.'},
{id:'j16',ch:'pop',from:'تطبيق «كرتوني AI»',sub:'طلب صلاحيات',body:'حوّل صورتك لشخصية كرتون 🎨 يحتاج [[الوصول لكل صورك وجهات الاتصال]].',insp:'تطبيق فلتر لا يحتاج جهات الاتصال.',scam:1,lever:'greed',tell:'صلاحيات أكثر من اللازم تعني تطبيقًا يجمع بياناتك.',right:'ارفض، واختر تطبيقًا معروفًا مع أهلك.'},
{id:'j17',ch:'notif',from:'متجر التطبيقات',sub:'إشعار من النظام',body:'تم تحديث «بلوكس لاند» إلى الإصدار الجديد.',insp:'إشعار من المتجر الرسمي، بلا رابط ولا طلب.',scam:0,ok:'تحديث من المتجر الرسمي، وهذا آمن ومفيد.'},
{id:'j18',ch:'wa',from:'بابا',sub:'رقم محفوظ',body:'وصلت تحت البيت، انزل 🚗',insp:'رقمه المحفوظ، ولا يطلب شيئًا.',scam:0,ok:'رسالة عادية من رقم أبيك المحفوظ.'},
{id:'j19',ch:'notif',from:'بلوكس لاند',sub:'إشعار من التطبيق',body:'تم تفعيل الحماية بخطوتين لحسابك. لن نطلب رمزك أبدًا.',insp:'إشعار داخل التطبيق الرسمي، بلا رابط.',scam:0,ok:'تأكيد حماية من التطبيق الرسمي، ولا يطلب شيئًا.'},
{id:'j20',ch:'sms',from:'المدرسة',sub:'رسالة نصية',body:'غدًا رحلة المركز العلمي. لا تنسوا الغدا والماي 🎒',insp:'رسالة تذكير بلا رابط ولا طلب.',scam:0,ok:'تذكير عادي لا يطلب شيئًا.'},
{id:'j21',ch:'sms',from:'بلوكس لاند',sub:'رسالة نصية',ctx:'<b>الموقف:</b> سجّلت دخولك للعبة قبل لحظة.',body:'رمز الدخول: 7741. لا تعطه لأحد، حتى لو قال إنه من فريق اللعبة.',insp:'وصلك لأنك أنت من سجّل الدخول.',scam:0,ok:'رسالة رمز طبيعية لأنك أنت من طلبه. المهم ألا ترسله لأحد.'},
{id:'j22',ch:'life',from:'معلمتك',sub:'في الفصل',body:'«قبل ما تنزّلون أي تطبيق جديد، ارجعوا لأهلكم.»',insp:'نصيحة بلا أي طلب.',scam:0,ok:'نصيحة صحيحة من معلمتك.'},
{id:'j23',ch:'social',from:'حساب اللعبة الموثّق',sub:'منشور',body:'تنبيه: مواقع «الجواهر المجانية» احتيال. الجواهر فقط من داخل اللعبة.',insp:'حساب موثّق بعلامة رسمية، ولا يطلب شيئًا.',scam:0,ok:'تحذير رسمي بلا رابط ولا طلب.'},
{id:'j24',ch:'game',from:'عرض محدود',sub:'لعبة من خارج المتجر',body:'سلسلتك 30 يوم بتضيع! ⏰ [[ادفع 1 د.ك ببطاقة أهلك خلال دقيقة]] عشان تحفظها.',insp:'اللعبة ليست من المتجر الرسمي.',scam:1,lever:'urgency',tell:'العدّاد التنازلي يريدك أن تدفع قبل أن تفكر.',right:'لا تدفع شيئًا بدون أهلك، حتى لو كان قليلًا.'},
{id:'j25',ch:'wa',from:'ماما',sub:'رقم محفوظ',body:'لا تشتري شي باللعبة قبل ما تسألني ❤️',insp:'رقمها المحفوظ، ونصيحة بلا طلب.',scam:0,ok:'نصيحة من أمك من رقمها المحفوظ.'},
{id:'j26',ch:'social',from:'نشتري_حسابات',sub:'رسالة خاصة',body:'نعطيك 5 د.ك و[[تعطينا حسابك في اللعبة وكلمة سره]]. فلوس سهلة 💵',insp:'حساب مجهول يشتري حسابات.',scam:1,lever:'greed',tell:'حسابك يُستخدم في الاحتيال على غيرك، وأنت المسؤول.',right:'لا تبع حسابك ولا تعطِ كلمة سرك.'},
{id:'o1',ch:'sms',from:'PENSION-KW',sub:'رسالة نصية',body:'سيُوقف صرف معاشك لعدم تحديث بيانات إثبات الحياة. [[حدّث خلال 24 ساعة]]: {{pension-update-kw.co}}',insp:'الرابط ليس موقعًا حكوميًا رسميًا.',scam:1,lever:'fear',tell:'تهديد بإيقاف المعاش مع رابط ومهلة قصيرة.',right:'لا تفتح الرابط. اتصل بالجهة من رقمها الرسمي أو راجعها بنفسك.'},
{id:'o2',ch:'call',from:'+965 9••• ••18',sub:'رقم غير محفوظ',body:'عرفتني؟ أنا ولد أختك! بموقف محرج و[[أحتاج 200 د.ك الحين]]، و[[لا تقول لأمي]].',insp:'لم يذكر اسمه، وينتظر أن تقوله أنت.',scam:1,lever:'trust',tell:'«عرفتني؟» حيلة تجعلك تقول الاسم بنفسك.',right:'اسأله عن اسمه، ثم اتصل بأخته أو برقمه المحفوظ.'},
{id:'o3',ch:'wa',from:'حفيدك علي',sub:'رقم محفوظ',body:'ركّبت لك تطبيق البنك من المتجر الرسمي. ولا تعطي أحد الرقم السري، حتى أنا 😄',insp:'رقمه المحفوظ، ونصيحة بلا طلب.',scam:0,ok:'رسالة من حفيدك على رقمه المحفوظ، ولا تطلب شيئًا.'},
{id:'o4',ch:'life',from:'رجل بزي رسمي',sub:'عند باب البيت',body:'«من وزارة الكهرباء والماء. فاتورتكم متأخرة، [[ادفع لي كاش الحين]] وإلا نقطع.»',insp:'لا يحمل بطاقة، والجهات لا تحصّل نقدًا عند الباب.',scam:1,lever:'authority',tell:'الدفع عبر القنوات الرسمية فقط، لا نقدًا لمن يطرق الباب.',right:'لا تدفع. تأكد من الفاتورة من التطبيق الرسمي أو اتصل بالجهة.'},
{id:'o5',ch:'call',from:'حملة حج وعمرة',sub:'+965 2••• ••56',body:'[[عرض ينتهي اليوم]]: عمرة بنص السعر. حوّل العربون على [[حساب شخصي]] ونحجز لك.',insp:'الحملات المرخّصة تقبض على حساب الشركة لا حساب شخص.',scam:1,lever:'urgency',tell:'سعر أقل بكثير، ومهلة قصيرة، وحساب شخصي: ثلاث علامات.',right:'تأكد من ترخيص الحملة وادفع في مكتبها.'},
{id:'o6',ch:'call',from:'+965 5••• ••77',sub:'صوت حفيدك يبكي',body:'«[[يدّه انمسكت]]، المحامي بيكلمك. [[حوّل الكفالة بسرعة]] ولا تقول لأبوي.»',insp:'رقم جديد، والصوت يشبه حفيدك تمامًا.',scam:1,lever:'trust',tell:'الذكاء الاصطناعي يقلّد صوت الأحفاد، والسرية والاستعجال علامتان.',right:'سكّر واتصل بحفيدك أو بأبيه على الرقم المحفوظ.'},
{id:'o7',ch:'life',from:'شخص عند الصراف',sub:'يعرض المساعدة',body:'«البطاقة علقت؟ [[دخّل الرقم السري مرة ثانية]] وأنا أساعدك.» وهو [[واقف وراك]].',insp:'يقف قريبًا جدًا ويرى الشاشة.',scam:1,lever:'trust',tell:'يحفظ رقمك السري ثم يسحب البطاقة العالقة.',right:'لا تدخل الرقم أمام أحد. اتصل بالبنك من الرقم خلف البطاقة.'},
{id:'o8',ch:'sms',from:'البنك',sub:'رسالة نصية',ctx:'<b>الموقف:</b> سحبت قبل دقائق من الصراف.',body:'سحب نقدي 40.000 د.ك من بطاقتك المنتهية بـ 2271.',insp:'يطابق سحبك، بلا رابط ولا طلب.',scam:0,ok:'إشعار يطابق ما فعلته، ولا يطلب شيئًا.'},
{id:'z1',ch:'sms',from:'KNET-PAY',sub:'رسالة نصية',body:'تعذّر إكمال دفعتك الأخيرة. لإكمالها وتفادي إيقاف الخدمة [[أعد إدخال بيانات بطاقتك]] من بوابة الدفع: [[{{knet-payment.kw-secure.net}}]]',insp:'مرسلة من رقم جوال عادي، وأنت ما حاولت تدفع شي اليوم، والعنوان مو عنوان بوابة الدفع الرسمية.',scam:1,lever:'urgency',tell:'صفحة تشبه بوابة كي نت تسرق بيانات البطاقة والرمز. بوابة الدفع تفتح بس وأنت تشتري بنفسك من متجر.',right:'لا تفتح الرابط. إذا عندك دفعة معلّقة ادخل على المتجر نفسه.'},
{id:'z2',ch:'wa',from:'+965 9••• ••27',sub:'رقم غير محفوظ',ctx:'<b>الموقف:</b> ما وصلك أي تحويل اليوم.',body:'السلام عليكم، أرسلت لك 25 د.ك بومض بالغلط 🙏 [[بيوصلك الحين طلب دفع مني]]، [[اضغط موافقة]] عشان ترجع لي.',insp:'ما دخل حسابك أي مبلغ. و«طلب الدفع» يسحب من حسابك أنت.',scam:1,lever:'trust',tell:'الموافقة على «طلب دفع» تحوّل من حسابك أنت، ما ترجّع فلوس أحد.',right:'افحص رصيدك بنفسك، ولا توافق على طلب دفع ما تعرفه، وبلّغ البنك.'},
{id:'z3',ch:'wa',from:'+965 6••• ••53',sub:'يقول إنه مندوب توصيل',body:'هلا، عشان أسلّمك الطلبية [[بيوصلك طلب في تطبيق هويتي]]، [[وافق عليه بسرعة]] وأنا جاي.',insp:'ما بدأت أنت أي معاملة. طلب التوثيق في هويتي معناه أن أحد يحاول يدخل باسمك.',scam:1,lever:'urgency',tell:'الموافقة في هويتي توقيع رقمي باسمك. اللي ياخذها يقدر يسوي معاملات عنك.',right:'ارفض أي طلب في هويتي ما بدأته أنت بنفسك.'},
{id:'z4',ch:'sms',from:'Telecom-Gift',sub:'رسالة نصية',body:'هدية: 50GB مجانًا لمدة شهر! لتفعيلها [[اطلب من جوالك الكود ‎*21*‎ وبعده رقم خدمة العملاء]]. العرض [[ينتهي الليلة]].',insp:'الكود ‎*21*‎ يحوّل كل مكالماتك لرقم ثاني، والمرسل مو شركة الاتصالات.',scam:1,lever:'greed',tell:'تحويل المكالمات يخلي المحتال يستلم مكالمات التحقق من البنك بدالك.',right:'لا تطلب أي كود من رسالة. الباقات تتفعّل من تطبيق شركة الاتصالات.'},
