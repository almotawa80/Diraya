/* swipe bins: trash on the doubt side (left), saved folder on the trust side (right) */
.bin{position:absolute;top:46%;width:3.1rem;height:3.1rem;border-radius:16px;display:grid;place-items:center;z-index:4;pointer-events:none;opacity:0;transition:opacity .18s,transform .18s;transform:scale(.8)}

.bin.got{animation:binGot .5s}

.card.gone.tobin{transition:transform .42s cubic-bezier(.5,0,.75,.3),opacity .42s}

/* first-time play-style intro */

.demo{position:relative;height:150px;border-radius:16px;background:linear-gradient(180deg,#9ADCF0,#5BB4E5);overflow:hidden;direction:rtl}
.dhand{position:absolute;width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(35,44,90,.85);box-shadow:0 0 0 3px var(--saffron);z-index:5;pointer-events:none}
.dcard{position:absolute;left:50%;top:50%;width:46%;height:62%;margin:-15% 0 0 -23%;background:#fff;border-radius:12px;padding:.6rem;display:flex;flex-direction:column;gap:.35rem;box-shadow:0 6px 14px rgba(35,44,90,.3)}
.dcard i{display:block;height:.45rem;border-radius:9px;background:#D7DBEA}

@keyframes dSwH{0%,10%{transform:none;opacity:0}16%{opacity:1;transform:none}32%{transform:translateX(-70px);opacity:1}38%,58%{opacity:0;transform:translateX(-70px)}60%{transform:none;opacity:0}66%{opacity:1;transform:none}82%{transform:translateX(70px);opacity:1}88%,100%{opacity:0;transform:translateX(70px)}}
.d-swipe .dbin.l,.d-rapid .dbin.l{animation:dBinL 4s infinite}.d-swipe .dbin.r,.d-rapid .dbin.r{animation:dBinR 4s infinite}

.dbar{position:absolute;left:12%;right:12%;bottom:.6rem;height:.4rem;border-radius:9px;background:rgba(255,255,255,.5);overflow:hidden}

<title>واعي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: one phone-sized column. HUD on top, a "phone screen" stage whose wallpaper moves from dawn to night across the day, thumb controls at the bottom. Single committed night look. */
:root{
  color-scheme:dark;
  --ink:#232C5A; --ink2:#2F3A70; --ink3:#3D4884; --line:#606690;
  --paper:#FFFFFF; --paper2:#ECE9E1; --onpaper:#232C5A; --onpaper2:#545A84;
  --fg:#F6F6F0; --muted:#D9D8DE; --violet:#B7B4EE; --violet-d:#7D7AC4; --light:#F6F6F0; --lmuted:#D9D8DE; --gold:#E3BE7C; --deep:#232C5A;
  --tq:#1FC8B4; --tq-ink:#04332E; --saffron:#E3BE7C; --saffron-ink:#3A2A0C; --coral:#FF6B6B; --coral-ink:#3F0A0A;
  --c-sms:#4C6FFF; --c-wa:#1FA35B; --c-call:#14204A; --c-notif:#B7791F; --c-game:#7B4BD6; --c-social:#D6457F; --c-mail:#2F7FD0; --c-life:#0E8A7C; --c-pop:#C2410C; --bronze:#D98B5F; --silver:#CDD5EA;

}
html,body{height:100%}
html{font-size:17px}
body{background:var(--ink);color:var(--fg);font-family:var(--body);line-height:1.6;font-weight:500;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
bdi.url{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em;word-break:break-all}
.app{height:100%;max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.75rem;display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8rem}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ---------- home ---------- */
.brand{display:flex;align-items:center;gap:1.2rem;padding:.9rem .9rem .5rem}
.bell{position:relative;width:4.6rem;height:4.6rem;flex:none;border-radius:50%;background:var(--ink3);box-shadow:inset 0 0 0 3px var(--saffron);display:grid;place-items:center}

.bell::after{animation-delay:1.2s}

@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.45);opacity:0}}
@keyframes shake{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(-14deg)}72%{transform:rotate(12deg)}78%{transform:rotate(-8deg)}84%{transform:rotate(5deg)}}
.brand h1{font-weight:900;font-size:3.2rem;line-height:1;margin:0;color:var(--fg)}
.brand p{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}
.dayline{display:flex;justify-content:space-between;gap:.5rem;margin:0;padding:0 .3rem;color:var(--muted);font-size:.95rem}.dayline b{color:var(--saffron)}
.daychip{display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:var(--ink2);border-radius:var(--r);padding:.6rem .9rem;font-size:.9rem}
.daychip b{font-weight:800;font-size:1.25rem;color:var(--saffron)}
.streak{color:var(--muted)}
.challenge{background:var(--saffron);color:var(--saffron-ink);border-radius:var(--r);padding:.7rem .9rem;font-weight:600;font-size:.95rem}
h2.lbl{font-size:.95rem;font-weight:700;color:var(--fg);margin:.2rem 0 -.3rem;letter-spacing:.02em}
.tracks{display:grid;gap:.6rem}
#home{gap:1rem}
#home .cta{margin-top:auto}
.track{display:flex;align-items:center;gap:.8rem;text-align:start;background:var(--ink2);border:2px solid transparent;border-radius:var(--r);padding:.65rem .8rem;transition:border-color .15s,background .15s}

.track .t1{font-weight:700;font-size:1.02rem}
.track .t2{color:var(--muted);font-size:.9rem}

.track .t3 b{display:block;font-weight:800;font-size:1.05rem;color:var(--saffron)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;font-size:.88rem;text-align:center;color:var(--muted)}
.how div{background:var(--ink2);border-radius:12px;padding:.55rem .35rem}

.toggles{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}

.ghost{background:var(--ink2);border-radius:var(--r);padding:.8rem 1rem;width:100%;font-weight:600}
.fine{font-size:.88rem;color:var(--muted);text-align:center;margin:0}

/* ---------- play ---------- */
.hud{display:flex;align-items:center;gap:.6rem}
.bal{line-height:1.15}
.bal small{display:block;font-size:.88rem;color:var(--muted)}

.dots{margin-inline-start:auto;display:flex;gap:.28rem}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--ink3)}
.dots i.now{background:var(--fg)}
.dots i.perfect{background:var(--tq)}.dots i.partial{background:var(--saffron)}.dots i.fell{background:var(--coral)}.dots i.miss,.dots i.timeout{background:var(--muted)}
.x{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--ink2);color:var(--muted);font-size:1.1rem;line-height:1}
.stage{flex:1;min-height:0;border-radius:28px;padding:.7rem;display:flex;flex-direction:column;gap:.55rem;position:relative;overflow:hidden;transition:background 1s;background:linear-gradient(180deg,var(--w1,#9ADCF0),var(--w2,#5BB4E5))}
.statusbar{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700;color:var(--onpaper);padding:0 .4rem;font-variant-numeric:tabular-nums}
.stage.night .statusbar{color:var(--fg)}
.ctx{align-self:flex-start;background:rgba(35,44,90,.82);color:var(--fg);font-size:.88rem;border-radius:12px;padding:.35rem .7rem}
.ctx b{color:var(--saffron);font-weight:600}
.cardwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.app.fb .cardwrap{align-items:flex-start}
.app.fb .ctx,.app.fb .insp{display:none}
.card{width:100%;max-height:100%;background:var(--paper);color:var(--onpaper);border-radius:18px;box-shadow:0 14px 30px rgba(35,44,90,.35);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative;animation:drop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes drop{from{transform:translateY(-40px) scale(.94);opacity:0}}
.card.fly{transition:transform .28s ease-in,opacity .28s}
.chead{display:flex;align-items:center;gap:.6rem;padding:.65rem .85rem;border-bottom:1px solid var(--paper2)}
.cico{flex:none;width:2.3rem;height:2.3rem;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--cc)}
.cico svg{width:1.3rem;height:1.3rem}
.chead .f{min-width:0;flex:1}
.chead .f b{display:block;font-size:1rem;line-height:1.3;overflow-wrap:anywhere}
.chead .f span{display:block;font-size:.88rem;color:var(--onpaper2)}
.chead time{font-size:.88rem;color:var(--onpaper2);white-space:nowrap}
.cbody{padding:.85rem .95rem;font-size:1.1rem;line-height:1.8;overflow-y:auto;overflow-wrap:anywhere}
.card.wa .cbody{background:#E9F5EC}
.card.wa .bub{background:#fff;border-radius:.2rem 1rem 1rem 1rem;padding:.55rem .75rem;display:inline-block;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.card.game .cbody{background:#EFE8FF}
.card.call{background:var(--deep);color:var(--light);text-align:center}
.card.call .chead{flex-direction:column;border:0;padding-top:1.1rem;gap:.35rem}
.card.call .chead .f span,.card.call .chead time{color:var(--muted)}

.tell{transition:background .3s,color .3s;border-radius:.3rem}

.why{margin:0 .8rem .75rem;padding:.45rem .7rem;border-radius:12px;background:var(--coral);color:var(--coral-ink);font-size:.92rem;font-weight:700;line-height:1.5}
.why small{display:block;font-weight:600;font-size:.88rem}
.hand{position:absolute;inset:auto 0 18% 0;margin:auto;width:3.2rem;height:3.2rem;border-radius:50%;background:rgba(35,44,90,.82);box-shadow:0 0 0 3px var(--saffron);z-index:3;pointer-events:none;animation:handL 1.6s ease-in-out infinite}
.hand.r{animation-name:handR}
@keyframes handL{0%,15%{transform:translateX(60px);opacity:0}30%{opacity:1}80%{transform:translateX(-70px);opacity:1}100%{transform:translateX(-70px);opacity:0}}

.ctx.coach{align-self:stretch;background:var(--onpaper);border:2px solid var(--saffron);font-size:.95rem;font-weight:600;line-height:1.55}
.b-in.glow{box-shadow:0 0 0 3px var(--saffron);animation:bump 1s infinite}
.skip{align-self:center;color:var(--onpaper);background:rgba(246,248,255,.7);border-radius:99px;padding:.2rem .9rem;font-size:.88rem;font-weight:700}

{id:'y1',t:'y',ch:'sms',from:'TardExpress',sub:'رسالة نصية',body:'عزيزي العميل، شحنتك رقم KW48213 معلّقة لعدم سداد رسوم الجمارك 1.250 د.ك. [[ادفع خلال 12 ساعة]] لتفادي الإرجاع: [[{{tard-express.kw-pay.info}}]]',insp:'مرسلة من رقم دولي يبدأ بـ ‎+44، والنطاق ليس موقع شركة الشحن.',scam:1,lever:'urgency',loss:320,tell:'المبلغ صغير عمدًا. الهدف بيانات البطاقة، ثم تُسحب مبالغ أكبر. والرابط لا يخص شركة الشحن.',right:'افتح تطبيق شركة الشحن بنفسك وابحث برقم الشحنة.',acts:[['أفتح تطبيق شركة الشحن بنفسي وأتأكد برقم الشحنة',2,'هذا هو التصرف الذهبي: تحقّق من القناة الرسمية، لا من الرابط.'],['أحذف الرسالة',1,'آمن. ولو كنت تنتظر شحنة فعلًا، تأكد من التطبيق الرسمي.'],['أدخل الرابط بس أشوف، وما أدفع',0,'الصفحة المقلَّدة مصممة لتقنعك. مجرد الدخول يقرّبك من الخطأ.']]},
{id:'y2',t:'y',ch:'call',from:'البنك · قسم الحماية',sub:'+965 2••• ••40',body:'معاك أحمد من قسم الحماية في البنك. رصدنا عملية مشبوهة على بطاقتك. عشان نوقفها [[بيوصلك رمز من ست أرقام، عطيني إياه]].',insp:'رقم المتصل يمكن تزويره ليشبه رقم البنك. المهم هو ما يطلبه منك.',scam:1,lever:'authority',loss:480,tell:'البنك لا يطلب رمز التحقق أبدًا. الرمز الذي يصلك هو نفسه الذي يُكمل عملية السحب.',right:'أغلق الخط واتصل برقم البنك المكتوب خلف بطاقتك.',acts:[['أسكّر وأتصل برقم البنك المكتوب خلف بطاقتي',2,'بالضبط. أنت من يتصل بالبنك، وليس العكس.'],['أسكّر وبس',1,'حميت نفسك. والأفضل تتصل بالبنك لتتأكد من بطاقتك وتبلّغ.'],['أطلب اسمه ورقمه الوظيفي أول',0,'أي محتال عنده اسم ورقم جاهزان. الأسئلة لا تكشفه، إغلاق الخط يكشفه.']]},
{id:'y3',t:'y',ch:'wa',from:'+965 5••• ••61',sub:'رقم جديد بصورة أخيك فهد',body:'هلا، أنا فهد أخوك. جوالي طاح بالماي وهذا رقمي المؤقت. محتاج [[150 د.ك الحين ضروري]]، حوّلهم على هالرابط وأرجعهم لك باجر 🙏',insp:'الرقم غير محفوظ، والصورة مأخوذة من حساب فهد العام. رقم فهد القديم ما زال عندك.',scam:1,lever:'trust',loss:150,tell:'رقم جديد مع طلب مال مستعجل. الصورة والاسم يُنسخان في ثوانٍ.',right:'اتصل على الرقم القديم المحفوظ قبل أي تحويل.',acts:[['أتصل على رقم فهد القديم المحفوظ عندي',2,'ممتاز. مكالمة واحدة على الرقم المعروف تنهي القصة.'],['أطلب منه يرسل مقطع صوتي',1,'أحسن من لا شيء، لكن الصوت صار يُقلَّد. الرقم القديم أضمن.'],['أحوّل نص المبلغ احتياط',0,'نصف المبلغ خسارة كاملة. ما في تحويل قبل التأكد.',75]]},
{id:'y4',t:'y',ch:'social',from:'منصة الخليج للتداول الذكي',sub:'إعلان مموَّل',body:'📈 [[أرباح مضمونة 30% أسبوعيًا]] بالذكاء الاصطناعي. ابدأ بـ 100 د.ك فقط وشوف تحويلات عملائنا 👇 [[المقاعد محدودة]].',insp:'لا يوجد رقم ترخيص، والشركة غير مدرجة في قائمة الجهة الرقابية على الاستثمار.',scam:1,lever:'greed',loss:100,tell:'كلمة «مضمونة» تكفي. لا يوجد استثمار حقيقي يضمن ربحًا، وصور التحويلات تُفبرك.',right:'تجاهل وبلّغ. ولا تستثمر إلا عند جهة مرخّصة تتأكد منها بنفسك.',acts:[['أتجاهل وأبلّغ عن الإعلان: ما في ربح مضمون',2,'صح. الوعد بربح مضمون علامة احتيال كافية وحدها.'],['أسألهم بالخاص عن الترخيص',1,'بيرسلون شهادة مزوّرة. التأكد يكون من موقع الجهة الرقابية نفسها.'],['أجرّب بمبلغ صغير 20 د.ك',0,'يتركونك تربح أول مرة لتضع أكثر، ثم يختفي الكل.',20]]},
{id:'y5',t:'y',ch:'wa',from:'مشتري من تطبيق المستعمل',sub:'+965 9••• ••15',ctx:'<b>الموقف:</b> عارض كنبة للبيع بـ 90 د.ك.',body:'أبيها بدون مفاصل. بدفع لك أونلاين الحين، ادخل هالرابط و[[حط بيانات بطاقتك عشان تستلم المبلغ]]: {{pay-receive-kw.link}}',insp:'استلام المال لا يحتاج رقم البطاقة ولا تاريخها ولا الرمز الخلفي. يكفي الآيبان.',scam:1,lever:'trust',loss:260,tell:'من يستلم المال لا يُدخل بيانات بطاقته. هذه صفحة سحب متنكرة في شكل صفحة إيداع.',right:'كاش عند الاستلام، أو تحويل على الآيبان فقط.',acts:[['أقول له: كاش عند الاستلام أو تحويل على الآيبان',2,'صح. المشتري الجاد يقبل، والمحتال يختفي.'],['أتجاهله وأنتظر مشتري ثاني',1,'آمن. وتذكّر القاعدة مع المشتري القادم.'],['أدخل رقم البطاقة بس، بدون الرمز السري',0,'رقم البطاقة وتاريخها والرمز الخلفي تكفي للسحب.',260]]},
{id:'y6',t:'y',ch:'sms',from:'TRAFFIC-KW',sub:'رسالة نصية',body:'لديك مخالفة مرورية غير مسددة. [[سيتم حجز المركبة ومنع السفر]] إن لم تُسدَّد اليوم: [[{{fines-kw-pay.site}}]]',insp:'مرسلة من رقم جوال عادي، والرابط ليس نطاقًا حكوميًا.',scam:1,lever:'fear',loss:210,tell:'تهديد كبير ومهلة قصيرة ورابط غير حكومي. المخالفات تظهر في التطبيق الحكومي الرسمي.',right:'افتح التطبيق الحكومي الرسمي بنفسك وتحقق من المخالفات.',acts:[['أفتح التطبيق الحكومي الرسمي بنفسي وأشوف المخالفات',2,'ممتاز. إن كانت هناك مخالفة فستجدها هناك.'],['أحذف الرسالة',1,'آمن. والتأكد من التطبيق الرسمي يريح بالك.'],['أتصل على الرقم المرسِل وأستفسر',0,'الرقم للمحتال نفسه، وسيكمل الضغط بصوته.']]},
{id:'y7',t:'y',ch:'wa',from:'شركة توظيف عن بُعد',sub:'+44 7••• ••3981',body:'مرحبًا 👋 وظيفة من البيت: [[5 د.ك عن كل لايك]] وتقييم. أول مهمة تُدفع فورًا! بعدها [[تدفع 30 د.ك لفتح المهام الذهبية]].',insp:'رقم دولي، ولا يوجد اسم شركة ولا عقد ولا مقابلة.',scam:1,lever:'greed',loss:30,tell:'الوظيفة الحقيقية تدفع لك ولا تطلب منك أن تدفع. الدفعة الأولى الصغيرة طُعم.',right:'بلوك وتبليغ. أي عمل يطلب منك مالًا لتبدأ ليس عملًا.',acts:[['بلوك وتبليغ',2,'صح. من يطلب مالًا لتشتغل عنده ليس صاحب عمل.'],['آخذ أول مهمة مجانية وأوقف',0,'المهمة الأولى تسحب منك بياناتك ورقم حسابك، وتبدأ سلسلة الضغط.'],['أسأل عن اسم الشركة وسجلها',1,'بيعطونك أي اسم. العلامة الكافية أنهم يطلبون مالًا.']]},
{id:'y8',t:'y',ch:'call',from:'الدعم الفني للبنك',sub:'+965 2••• ••77',body:'معاك الدعم الفني. تطبيق البنك عندك فيه خلل أمني. [[نزّل برنامج المساعدة عن بُعد]] و[[عطني الرقم اللي يطلع لك]] ونصلحه خلال دقيقتين.',insp:'البنك لا يطلب تنزيل أي برنامج تحكم. هذا البرنامج يعطي المتصل شاشة جوالك كاملة.',scam:1,lever:'authority',loss:600,tell:'برنامج التحكم عن بُعد يجعل المحتال يرى شاشتك ويفتح تطبيق البنك بيدك.',right:'لا تنزّل أي برنامج بطلب متصل. أغلق واتصل بالبنك.',acts:[['أسكّر وأتصل بالبنك من الرقم خلف البطاقة',2,'صح. وأي خلل حقيقي يُحلّ من التطبيق الرسمي أو الفرع.'],['أسكّر وبس',1,'حميت نفسك. بلّغ البنك حتى يحذّر غيرك.'],['أنزّل البرنامج بس ما أعطيه الرقم',0,'مجرد وجود البرنامج خطر. احذفه فورًا.']]},
{id:'y9',t:'y',ch:'notif',from:'تطبيق البنك',sub:'إشعار من التطبيق',body:'تم إيداع راتب بمبلغ 850.000 د.ك في حسابك المنتهي بـ 4410.',insp:'إشعار من التطبيق المثبّت على جوالك، بدون رابط ولا طلب.',scam:0,ok:'خبر فقط من التطبيق نفسه. لا رابط، لا طلب، لا استعجال.'},
{id:'y10',t:'y',ch:'sms',from:'البنك',sub:'رسالة نصية',ctx:'<b>الموقف:</b> أنت الآن تدفع 23.500 د.ك في موقع الجمعية.',body:'رمز التحقق 482913 لعملية شراء بمبلغ 23.500 د.ك لدى COOP-ONLINE. لا تشارك الرمز مع أحد.',insp:'المبلغ والتاجر يطابقان ما تفعله الآن، ولم يطلب أحد منك الرمز.',scam:0,yes:'أُدخل الرمز بنفسي',ok:'أنت من بدأ العملية، والمبلغ والتاجر مطابقان، والرمز تُدخله أنت ولا تقوله لأحد.'},
{id:'y11',t:'y',ch:'call',from:'البنك',sub:'الرقم المحفوظ في جهات الاتصال',ctx:'<b>الموقف:</b> اشتريت قبل دقيقة من متجر إلكتروني بـ 64 د.ك.',body:'معاك البنك. في عملية بـ 64.000 د.ك من متجر إلكتروني قبل دقيقة. أنت من قام بها؟ ما نحتاج أي رمز أو بيانات.',insp:'لم يطلب رمزًا ولا رقمًا سريًا ولا تحويلًا، والعملية تطابق ما فعلته.',scam:0,soft:1,yes:'أجاوب: نعم أنا',ok:'الفرق في الطلب وليس في القناة: لم يطلب أي سر. ولو أغلقت واتصلت بالبنك بنفسك فهذا مقبول دائمًا.'},
{id:'y12',t:'y',ch:'sms',from:'طرد إكسبرس',sub:'رسالة نصية',ctx:'<b>الموقف:</b> تنتظر طلبية منذ أسبوع.',body:'شحنتك KW48213 خرجت للتوصيل اليوم. المندوب سيتصل بك قبل الوصول. الدفع عند الاستلام.',insp:'نفس المرسل الذي أكّد طلبك قبل أسبوع. لا رابط ولا مبلغ مطلوب الآن.',scam:0,ok:'خبر يطابق طلبًا تنتظره، بدون رابط ولا دفع مسبق.'},
{id:'y13',t:'y',ch:'wa',from:'أمي',sub:'رقم محفوظ',body:'لا تنسون تمرّون الجمعية وإنتوا راجعين، نبي خبز ولبن.',insp:'رقم أمك المحفوظ، وطلب عادي.',scam:0,ok:'رقم محفوظ وطلب يومي عادي. ليس كل طلب احتيالًا.'},

/* ===== بو فهد ===== */
{id:'e1',t:'e',ch:'call',from:'المباحث الإلكترونية',sub:'+965 2••• ••99',body:'معاك النقيب خالد. حسابك مستخدم في قضية غسيل أموال. [[حوّل رصيدك الحين على حساب آمن]] و[[لا تخبر أحد]]، القضية سرّية.',insp:'لا توجد جهة أمنية تطلب تحويل أموال بالهاتف. الاستدعاء الرسمي يكون بكتاب أو عبر القنوات الحكومية.',scam:1,lever:'authority',loss:1200,tell:'لا يوجد شيء اسمه «حساب آمن». وطلب السرّية يعزلك عن أهلك الذين سيكشفون الخدعة.',right:'أغلق الخط وكلّم أحد أبنائك، ثم اتصل بالبنك.',acts:[['أسكّر وأكلّم ولدي أو بنتي، وبعدها أتصل بالبنك',2,'بالضبط. المحتال يخاف من شخص ثانٍ يسمع القصة.'],['أسكّر وبس',1,'حميت مالك. خبّر أهلك والبنك لأنه سيعاود الاتصال.'],['أقول له: بروح المخفر وأتأكد',1,'فكرة سليمة، لكن لا تكمل الكلام معه. أغلق أولًا.']]},
{id:'e2',t:'e',ch:'call',from:'البنك · خدمة العملاء',sub:'+965 2••• ••40',body:'مساك الله بالخير يا عم. بطاقتك راح تتجدد اليوم. [[بيوصلك رمز برسالة، قوله لي]] عشان نفعّل البطاقة اليديدة.',insp:'رقم المتصل يمكن تزويره. البنك لا يطلب الرمز من أي عميل.',scam:1,lever:'authority',loss:650,tell:'الرمز الذي يصلك هو توقيعك على عملية سحب. البنك لا يطلبه أبدًا.',right:'الرمز لا يُقال لأحد. أغلق واتصل بالرقم المكتوب خلف البطاقة.',acts:[['أسكّر وأتصل بالرقم المكتوب خلف البطاقة',2,'صح. أنت من يتصل بالبنك.'],['أسكّر وبس',1,'آمن. والأفضل تبلّغ البنك.'],['أسأله: شنو اسمك ومن أي فرع؟',0,'عنده جواب جاهز لكل سؤال. لا تبقَ على الخط.']]},
{id:'e3',t:'e',ch:'wa',from:'+965 5••• ••61',sub:'رقم جديد بصورة ولدك فهد',body:'يبه أنا فهد، هذا رقمي اليديد. [[محتاج 300 د.ك ضروري الحين]] وما أقدر أتكلم، حوّلهم على هالرقم وأفهّمك بعدين.',insp:'رقم غير محفوظ. رقم فهد المعروف ما زال في جوالك.',scam:1,lever:'trust',loss:300,tell:'رقم جديد، وطلب مال مستعجل، و«ما أقدر أتكلم». الثلاثة معًا علامة انتحال.',right:'اتصل على رقم فهد القديم قبل أي تحويل.',acts:[['أتصل على رقم فهد القديم',2,'ممتاز. مكالمة واحدة تكفي.'],['أسأله عن كلمة سر العائلة',2,'ممتاز. كلمة سر متفق عليها بين العائلة تهزم المنتحل.'],['أحوّل له، ما أخلّي ولدي محتاج',0,'عاطفتك هي ما يراهن عليه المحتال.',300]]},
{id:'e4',t:'e',ch:'sms',from:'BANK-ALERT',sub:'رسالة نصية',body:'عزيزنا العميل، [[سيتم إيقاف بطاقتك البنكية اليوم]] لعدم تحديث البيانات. للتحديث فورًا: [[{{bank-update-kw.info}}]]',insp:'ليست من نفس المرسل الذي تصلك منه رسائل بنكك، والرابط ليس موقع البنك.',scam:1,lever:'fear',loss:450,tell:'البنك لا يرسل رابطًا لتحديث البيانات. التحديث يكون في الفرع أو داخل التطبيق.',right:'تجاهل الرابط. وإن قلقت فاتصل بالبنك أو زُر الفرع.',acts:[['أتصل بالبنك من الرقم خلف البطاقة وأسأل',2,'صح. سيؤكدون لك أن بطاقتك سليمة.'],['أحذف الرسالة',1,'آمن.'],['أدخل الرابط وأحدّث بياناتي',0,'الصفحة تنسخ رقم بطاقتك ورمزك.',450]]},
{id:'e5',t:'e',ch:'sms',from:'ID-RENEW',sub:'رسالة نصية',body:'الهوية الرقمية: انتهت صلاحية بياناتك. جدّدها خلال 24 ساعة لتفادي [[غرامة 100 د.ك]]: [[{{id-renew-kw.site}}]]',insp:'الرابط ليس نطاقًا حكوميًا، والمرسل رقم جوال.',scam:1,lever:'fear',loss:180,tell:'الجهات الحكومية تنبّهك داخل تطبيقها الرسمي، لا برابط غريب في رسالة.',right:'افتح التطبيق الحكومي الرسمي بنفسك، أو اسأل أحد أبنائك.',acts:[['أفتح التطبيق الحكومي الرسمي بنفسي',2,'صح.'],['أسأل ولدي يشوفها لي',2,'ممتاز. سؤال شخص تثق به من أقوى الحمايات.'],['أدخل الرابط قبل ما تنتهي المهلة',0,'المهلة مختلقة لتستعجل.',180]]},
{id:'e6',t:'e',ch:'call',from:'سحب الجوائز الكبرى',sub:'+965 6••• ••33',body:'مبروك يا عم! رقمك فاز معانا بـ [[10,000 د.ك]]. بس نحتاج [[رقم بطاقتك عشان نحوّل الجائزة]] ورسوم بسيطة 20 د.ك.',insp:'لم تشترك في أي سحب. والجوائز الحقيقية لا رسوم عليها.',scam:1,lever:'greed',loss:220,tell:'جائزة من سحب لم تدخله، مع طلب رقم البطاقة ورسوم. الجائزة الحقيقية لا تكلّفك شيئًا.',right:'أغلق الخط. ما في جائزة تحتاج بطاقتك.',acts:[['أسكّر الخط',2,'صح، ببساطة.'],['أقول له: خصموا الرسوم من الجائزة',1,'رد ذكي يكشفه، لكن لا تطوّل معه.'],['أعطيه رقم البطاقة بدون الرمز السري',0,'رقم البطاقة وحده يكفي لكثير من العمليات.',220]]},
{id:'e7',t:'e',ch:'wa',from:'قروب «استثمار الذهب»',sub:'أُضفت للقروب من رقم غريب',body:'الدكتور ماجد: مبروك للأعضاء أرباح هالأسبوع 🟡 [[ضاعف معاشك التقاعدي خلال شهر]]. التحويل على حساب المدير، و[[باقي 3 مقاعد]].',insp:'كل «الأعضاء» أرقام غريبة تمدح. لا يوجد ترخيص ولا عقد.',scam:1,lever:'greed',loss:500,tell:'شهادات الأعضاء في القروب مفبركة، والتحويل لحساب شخصي. لا استثمار حقيقي يضاعف المال في شهر.',right:'اخرج من القروب وبلّغ عنه. واستشر أبناءك أو بنكك قبل أي استثمار.',acts:[['أطلع من القروب وأبلّغ عنه',2,'صح.'],['أسأل البنك عن استثمار مرخّص',2,'ممتاز. الاستثمار يكون عبر جهة مرخّصة فقط.'],['أجرّب بـ 50 د.ك',0,'يردّون لك ربحًا صغيرًا أول مرة لتضع المبلغ الكبير.',50]]},
{id:'e8',t:'e',ch:'notif',from:'تطبيق البنك',sub:'إشعار من التطبيق',body:'تم إيداع المعاش التقاعدي بمبلغ 1,150.000 د.ك في حسابك.',insp:'إشعار من تطبيق البنك نفسه، بدون رابط ولا طلب.',scam:0,ok:'خبر فقط. لا رابط، لا طلب.'},
{id:'e9',t:'e',ch:'sms',from:'مستوصف المنطقة',sub:'رسالة نصية',body:'نذكّركم بموعد عيادة السكر غدًا الساعة 9:30 صباحًا. يرجى إحضار البطاقة المدنية.',insp:'موعد حجزته أنت الشهر الماضي، من نفس المرسل.',scam:0,ok:'تذكير بموعد تعرفه. لا رابط ولا دفع.'},
{id:'e10',t:'e',ch:'wa',from:'بنتي مريم',sub:'رقم محفوظ',body:'يبه باجر الغدا عندنا، أمرّك الساعة 12؟ العيال مشتاقين لك.',insp:'رقم مريم المحفوظ من سنين.',scam:0,ok:'رقم محفوظ وكلام عادي، بدون مال ولا أسرار.'},
{id:'e11',t:'e',ch:'sms',from:'البنك',sub:'رسالة نصية',body:'تذكير: لن نطلب منك أبدًا الرقم السري أو رمز التحقق عبر الهاتف أو الرسائل. حملة «لنكن على دراية».',insp:'من نفس المرسل الذي تصلك منه رسائل بنكك. لا رابط ولا طلب.',scam:0,ok:'رسالة توعية لا تطلب شيئًا. وهي القاعدة الأهم في اللعبة كلها.'},
{id:'e12',t:'e',ch:'call',from:'البنك',sub:'الرقم المحفوظ في جهات الاتصال',ctx:'<b>الموقف:</b> دفعت قبل دقائق 38 د.ك في الصيدلية.',body:'معاك البنك. في عملية بـ 38.000 د.ك في صيدلية قبل دقائق. أنت من قام بها؟ ما نحتاج أي رمز أو بيانات.',insp:'لم يطلب رمزًا ولا رقمًا سريًا، والعملية تطابق ما فعلته.',scam:0,soft:1,yes:'أجاوب: نعم أنا',ok:'الفرق في الطلب: لم يطلب أي سر. ولو أغلقت واتصلت بالبنك بنفسك فهذا مقبول دائمًا.'}

{id:'m2',ch:'life',from:'ربيعك',sub:'في الديوانية',body:'«[[أجّر لي حسابك البنكي شهر واحد]] وأعطيك 150 د.ك. حسابي موقوف وعندي شغل بسيط بس.»',insp:'كل ما يمر في حسابك مسؤوليتك القانونية أنت.',scam:1,lever:'trust',tell:'تأجير الحساب جريمة. إن مرّت فيه أموال مشبوهة فأنت المتهم الأول.',right:'ارفض بوضوح، حتى مع صديق.'},
{id:'m3',ch:'wa',from:'+965 6••• ••84',sub:'رقم غير محفوظ',ctx:'<b>الموقف:</b> وصلك للتو تحويل 300 د.ك من مجهول.',body:'السلام عليكم، حوّلت لك 300 بالغلط 😢 [[رجّعهم لي على هالحساب الثاني]] الله يخليك، مستعجل.',insp:'يطلب الإرجاع إلى حساب غير الحساب الذي جاء منه التحويل.',scam:1,lever:'urgency',tell:'الإرجاع إلى حساب مختلف يجعلك حلقة في تمرير أموال مسروقة.',right:'لا تحوّل بنفسك. بلّغ بنكك وهو يعيد المبلغ لمصدره.'},
{id:'m4',ch:'life',from:'موظف الفرع',sub:'وأنت داخل البنك',body:'«نحتاج نحدّث بياناتك: جهة العمل ومصدر الدخل. هذا إجراء دوري لكل العملاء.»',insp:'أنت داخل الفرع الرسمي، والأسئلة عن العمل والدخل وليست عن أرقام سرية.',scam:0,yes:'أحدّث بياناتي',ok:'تحديث «اعرف عميلك» داخل الفرع واجب على البنك لمكافحة غسيل الأموال، ولا يُطلب فيه أي رقم سري.'},
{id:'m5',ch:'call',from:'رجل أعمال',sub:'تعرّفت عليه أونلاين',body:'أبي أفتح شركة بالكويت. [[افتح حساب باسمك وأنا أديره]]، مجرد توقيع ولك 500 د.ك شهريًا.',insp:'لا تعرف نشاطه الحقيقي، والحساب سيكون باسمك أنت أمام القانون.',scam:1,lever:'greed',tell:'حساب باسمك يديره غيرك غطاء معروف لغسيل الأموال.',right:'ارفض. لا تفتح حسابًا لغيرك ولا توقّع عن أحد.'},
{id:'m6',ch:'notif',from:'تطبيق البنك',sub:'إشعار من التطبيق',ctx:'<b>الموقف:</b> أخوك وعدك يرجّع لك قطية الغدا.',body:'وصلك تحويل بمبلغ 12.000 د.ك من أخيك. الملاحظة: «قطية الغدا».',insp:'مبلغ متوقع من شخص تعرفه ولسبب تعرفه.',scam:0,ok:'تحويل متوقع، من شخص معروف، ولسبب واضح. هذا هو الاستخدام الطبيعي للحساب.'},
{id:'m7',ch:'social',from:'نشتري_بطاقات',sub:'رسالة خاصة',body:'نشتري [[بطاقة الصراف مع الرقم السري]] بـ 50 د.ك، وشريحة باسمك بـ 20. استلام فوري 💵',insp:'البطاقة والشريحة ستُستخدمان في جرائم مسجّلة باسمك.',scam:1,lever:'greed',tell:'بيع بطاقتك أو شريحتك يعني أن كل جريمة تُرتكب بهما تُنسب إليك.',right:'تجاهل وبلّغ عن الحساب.'},
{id:'m8',ch:'call',from:'البنك',sub:'الرقم المحفوظ في جهات الاتصال',ctx:'<b>الموقف:</b> بعت سيارتك أمس ووصلك ثمنها 5,000 د.ك.',body:'معاك البنك. وصل حسابك تحويل كبير أمس، ممكن نعرف مصدره؟ يكفي تجاوب، وما نحتاج أي رمز أو رقم سري.',insp:'يسأل عن مصدر مبلغ وصلك فعلًا، ولا يطلب أي سر.',scam:0,soft:1,yes:'أوضّح المصدر',ok:'سؤال البنك عن مصدر مبلغ كبير إجراء قانوني لمكافحة غسيل الأموال. ولو شككت، أغلق واتصل بالبنك بنفسك.'},
/* -- الذكاء الاصطناعي -- */
{id:'a1',ch:'wa',from:'+965 5••• ••09',sub:'مقطع صوتي بصوت ولدك',body:'🎤 «يبه سويت حادث وجوالي انكسر. [[محتاج 400 د.ك الحين]] على هالحساب، [[لا تقول لأمي]].» الصوت صوته تمامًا.',insp:'رقم غير محفوظ. عشر ثوانٍ من صوته في مقطع منشور تكفي لتقليده.',scam:1,lever:'trust',tell:'الصوت لم يعد دليلًا. الذكاء الاصطناعي يقلّده من مقطع قصير.',right:'اتصل على رقمه المعروف، أو اسأله عن كلمة سر العائلة.'},
{id:'a2',ch:'social',from:'مقطع متداول',sub:'فيديو لشخصية مشهورة',body:'شخصية معروفة تقول بالفيديو: «[[استثمرت بهالمنصة وربحت 20 ألف بشهر]]، سجّلوا من الرابط». حركة الشفايف [[ما تطابق الكلام]] تمامًا.',insp:'الحساب الرسمي للشخصية لم ينشر المقطع، والرابط لموقع عمره أيام.',scam:1,lever:'authority',tell:'فيديو مزيّف بوجه مشهور للترويج لمنصة وهمية.',right:'تحقق من الحساب الرسمي للشخصية، ولا تسجّل من روابط المقاطع.'},
{id:'a3',ch:'call',from:'مكالمة فيديو · موظف البنك',sub:'رقم غير محفوظ',body:'يظهر وجه بزيّ رسمي وخلفه شعار. الصورة [[تتقطع والوجه ثابت بشكل غريب]]. يقول: «[[شارك شاشتك]] عشان نأمّن حسابك.»',insp:'البنك لا يتصل بالفيديو ولا يطلب مشاركة الشاشة.',scam:1,lever:'authority',tell:'وجه مولَّد بالذكاء الاصطناعي، وطلب مشاركة الشاشة يكشف تطبيق البنك ورموزك.',right:'أغلق المكالمة واتصل بالبنك من الرقم خلف البطاقة.'},
{id:'a4',ch:'social',from:'مها ✨',sub:'تعرّفت عليها قبل أسبوعين',body:'حبيبي اشتريت لك هدية بس [[حجزوها بالجمارك]] 😢 [[حوّل لي 120 د.ك]] أطلّعها وأرجّعهم لك أول ما نتقابل.',insp:'صورها مثالية بلا أي صورة عفوية، وترفض مكالمة الفيديو دائمًا.',scam:1,lever:'trust',tell:'شخصية بصور مولَّدة تبني علاقة ثم تطلب مالًا. لم تلتقِ بها أبدًا.',right:'لا ترسل مالًا لمن لم تقابله، واقطع التواصل.'},
{id:'a5',ch:'sms',from:'البنـك',sub:'رسالة نصية',body:'حرصًا على أمان حسابك، نرجو [[توثيق بصمة الوجه]] خلال 24 ساعة عبر الرابط: [[{{face-verify-kw.app}}]]',insp:'صياغة متقنة بلا أي خطأ، لكن اسم المرسل فيه مدّة زائدة والرابط ليس للبنك.',scam:1,lever:'fear',tell:'الإتقان اللغوي لم يعد علامة أمان. المحتال يكتب بالذكاء الاصطناعي. انظر إلى الرابط والطلب.',right:'توثيق الوجه يكون داخل تطبيق البنك فقط.'},
{id:'a6',ch:'pop',from:'المساعد الذكي للبنك',sub:'دردشة في موقع ظهر لك بالبحث',body:'أهلًا! أنا المساعد الذكي 🤖 للتحقق من هويتك [[أدخل رقم البطاقة ورمز التحقق]] الذي سيصلك الآن.',insp:'الموقع ظهر كإعلان في نتائج البحث، وعنوانه ليس عنوان البنك.',scam:1,lever:'authority',tell:'روبوت دردشة في موقع مقلَّد. حتى الآلة لا يحق لها طلب رمز التحقق.',right:'ادخل موقع البنك من التطبيق أو بكتابة العنوان بنفسك.'},
{id:'a9',ch:'pop',from:'تطبيق «جمّل صورتك AI»',sub:'شاشة التسجيل',body:'للتأكد من عمرك [[ارفع صورة بطاقتك المدنية وسيلفي]] ثم استمتع بالفلاتر مجانًا.',insp:'تطبيق صور لا يحتاج هويتك. الصورة والهوية تكفيان لفتح حسابات باسمك.',scam:1,lever:'greed',tell:'الهوية مع السيلفي تُستخدمان لانتحال شخصيتك وفتح حسابات باسمك.',right:'لا ترفع هويتك إلا لجهة رسمية تعرفها.'},
{id:'a7',ch:'call',from:'أخوك',sub:'مكالمة فيديو من رقمه المحفوظ',ctx:'<b>الموقف:</b> سألته عن كلمة سر العائلة فأجاب صح.',body:'«تطمّن، أنا. أبي منك رقم المطعم اللي رحنا له الأسبوع اللي طاف.»',insp:'رقمه المحفوظ، وأجاب عن كلمة السر، والطلب عادي بلا مال.',scam:0,ok:'رقم معروف، وكلمة سر العائلة صحيحة، وطلب عادي. كلمة السر العائلية تهزم الصوت والوجه المقلَّدين.'},
{id:'a8',ch:'notif',from:'تطبيق البنك',sub:'عند فتح التطبيق',body:'انظر إلى الكاميرا لتسجيل الدخول ببصمة الوجه.',insp:'يحدث داخل التطبيق الرسمي على جوالك عند فتحه.',scam:0,yes:'أسجّل الدخول',ok:'بصمة الوجه داخل التطبيق الرسمي على جهازك آمنة. الخطر حين يُطلب وجهك عبر رابط.'},
{id:'a10',ch:'social',from:'حساب البنك الموثّق',sub:'منشور',body:'تنبيه: تنتشر مقاطع مزيفة بالذكاء الاصطناعي تنتحل البنك. لا نطلب بياناتك عبر المقاطع أو الروابط.',insp:'الحساب الموثّق الذي تتابعه من سنوات، والمنشور لا يطلب شيئًا.',scam:0,ok:'منشور توعوي من الحساب الرسمي، لا يطلب شيئًا ولا يحمل رابطًا.'},
/* -- سرية العملاء والإفصاح -- */
{id:'c1',ch:'call',from:'خدمة العملاء',sub:'+965 2••• ••51',body:'معاك البنك. للتأكد من هويتك [[كم رصيدك الحالي وآخر ثلاث عمليات]]؟ و[[شنو الرقم السري]] للخدمة الهاتفية؟',insp:'البنك يعرف رصيدك وعملياتك، ولا يسألك عنها حين يتصل هو.',scam:1,lever:'authority',tell:'من يتصل بك لا يحق له أن يسألك عن رصيدك أو رقمك السري. هذه معلوماتك السرية.',right:'أغلق واتصل أنت بالبنك.'},
{id:'c2',ch:'life',from:'معرفة يشتغل في بنك',sub:'في جمعة',body:'«إذا تبي، [[أطلّع لك كشف حساب شريكك]] وتشوف وين يصرف. ما أحد راح يدري.»',insp:'إفشاء بيانات عميل جريمة على الموظف ومن يطلبها.',scam:1,lever:'trust',tell:'سرية حسابات العملاء محمية بالقانون. كما لا تريد أن يُكشف حسابك، لا تطلب كشف حساب غيرك.',right:'ارفض. وإن فعلها معك فسيفعلها بك.'},
{id:'c3',ch:'life',from:'موظف الفرع',sub:'وأنت داخل البنك',ctx:'<b>الموقف:</b> طلبت كشف حسابك.',body:'«قبل ما أطبع الكشف، ممكن البطاقة المدنية الأصلية؟»',insp:'التحقق من هويتك قبل تسليم بياناتك يحميك أنت.',scam:0,yes:'أعطيه البطاقة',ok:'التحقق من الهوية داخل الفرع قبل الإفصاح عن بياناتك هو تطبيق السرية لمصلحتك.'},
{id:'c4',ch:'life',from:'موظف معرض سيارات',sub:'عند توقيع التقسيط',body:'«عشان نسرّع الموافقة، [[سجّل دخولك بتطبيق البنك على جهازنا]] ونصوّر كشف الحساب.»',insp:'جهاز لا تملكه قد يحفظ اسم المستخدم وكلمة السر.',scam:1,lever:'urgency',tell:'تسجيل الدخول على جهاز غيرك يكشف حسابك كله ويترك بياناتك عندهم.',right:'اطلب كشفًا رسميًا من بنكك وسلّمه بنفسك.'},
{id:'c5',ch:'notif',from:'تطبيق البنك',sub:'طلب موافقة',ctx:'<b>الموقف:</b> قدّمت على تمويل من شركة.',body:'شركة التمويل تطلب الاطلاع على بياناتك الائتمانية. هل توافق؟ يمكنك الرفض.',insp:'طلب موافقة داخل التطبيق الرسمي، مرتبط بطلب قدّمته أنت.',scam:0,yes:'أوافق',ok:'لا تُشارك بياناتك مع طرف ثالث إلا بموافقتك. طلب الموافقة هو السرية وهي تعمل.'},
{id:'c6',ch:'wa',from:'استبيان رضا العملاء',sub:'+965 9••• ••70',body:'شاركنا رأيك واربح قسيمة 10 د.ك 🎁 فقط أكّد: [[الرقم المدني، رقم الحساب، تاريخ الميلاد]].',insp:'الاستبيان الحقيقي يسأل عن رأيك، لا عن بياناتك.',scam:1,lever:'greed',tell:'بياناتك الشخصية هي المطلوب، والقسيمة طُعم. بهذه البيانات يُنتحل اسمك عند البنك.',right:'لا تعطِ بياناتك عبر الرسائل.'},
{id:'c7',ch:'social',from:'ستوري جاهزة للنشر',sub:'حسابك أنت',body:'صوّرت بطاقتك البنكية اليديدة 💳 والكاميرا [[طالع فيها رقم البطاقة وتاريخها]]. تنشر؟',insp:'رقم البطاقة والتاريخ يكفيان للشراء من كثير من المواقع.',scam:1,lever:'trust',tell:'أنت أول من يحفظ سرية بياناتك. صورة واحدة تكفي لاستخدام بطاقتك.',right:'لا تنشر صور البطاقات ولا كشوف الحساب ولا تذاكر السفر.'},
{id:'c8',ch:'mail',from:'البنك',sub:'كتاب رسمي',body:'نحيطكم علمًا بأنه تم تزويد المحكمة ببيانات حسابكم بناءً على أمر قضائي رقم 1482. للاستفسار راجعوا الفرع.',insp:'إشعار بلا رابط ولا طلب، ويدعوك لمراجعة الفرع.',scam:0,ok:'السرية المصرفية لها استثناءات قانونية محددة، منها أمر القضاء. والبنك يبلغك ولا يطلب منك شيئًا.'},
{id:'c9',ch:'call',from:'شركة المعلومات الائتمانية',sub:'+965 2••• ••63',body:'تصنيفك الائتماني نزل. نقدر نرفعه اليوم، بس [[عطنا اسم المستخدم وكلمة السر لتطبيق البنك]] نراجع حسابك.',insp:'لا جهة رسمية تطلب كلمة سر تطبيقك لأي سبب.',scam:1,lever:'fear',tell:'لا أحد غيرك يحق له معرفة كلمة سر تطبيق البنك، مهما كانت الجهة.',right:'أغلق، وراجع تصنيفك من القنوات الرسمية بنفسك.'},
/* -- المواجهة الأخيرة -- */
{id:'b1',ch:'call',from:'+965 5••• ••38',sub:'رقم غير محفوظ',ctx:'<b>الموقف:</b> وصلك للتو رمز تحقق لعملية 399 د.ك لم تقم بها.',body:'ألو، آسف! كتبت رقمك بالغلط و[[وصلك رمزي]]. [[ممكن تقراه لي]]؟ ثواني بس.',insp:'الرمز مربوط ببطاقتك أنت، والعملية شراء بـ 399 د.ك.',scam:1,lever:'urgency',tell:'الرمز لم يصلك بالغلط. هو يملك رقم بطاقتك وينقصه الرمز فقط.',right:'لا تقرأ الرمز لأحد، واتصل بالبنك فورًا لإيقاف البطاقة.'},
{id:'b2',ch:'call',from:'مندوب التوصيل',sub:'+965 6••• ••91',ctx:'<b>الموقف:</b> تنتظر طلبية اليوم.',body:'أنا تحت البيت. النظام يطلب تأكيد: [[بيوصلك رمز، عطني إياه]] وأسلّمك الطلب.',insp:'رمز الاستلام يظهر في تطبيق المتجر، ولا يصل من البنك.',scam:1,lever:'urgency',tell:'استغل أنك تنتظر طلبية فعلًا. الرمز الذي سيصلك رمز بنكي وليس رمز استلام.',right:'اقرأ الرسالة جيدًا: إن كانت من البنك فلا تُعطِ الرمز لأحد.'},
{id:'b4',ch:'sms',from:'البنـك',sub:'رسالة نصية',body:'ضمن حملة لنكن على دراية: [[فعّل خدمة الحماية من الاحتيال]] الآن عبر: [[{{daraya-protect.kw-secure.net}}]]',insp:'اسم المرسل فيه مدّة زائدة، والرابط ليس موقع البنك.',scam:1,lever:'authority',tell:'المحتال يلبس ثوب حملة التوعية نفسها. العلامة هي الرابط والمرسل المقلَّد.',right:'أي خدمة حماية تُفعَّل من داخل تطبيق البنك.'},
{id:'b8',ch:'wa',from:'مسابقة لنكن على دراية',sub:'+965 9••• ••02',body:'جاوب على 3 أسئلة عن الاحتيال واربح 50 د.ك 🎉 [[أدخل بيانات بطاقتك لاستلام الجائزة]].',insp:'الجائزة تُحوَّل على الآيبان، ولا تحتاج بيانات البطاقة.',scam:1,lever:'greed',tell:'استلام أي مبلغ لا يحتاج بيانات بطاقتك، حتى لو كان الاسم اسم حملة توعية.',right:'تجاهل وبلّغ. الجوائز الحقيقية تُعلن في القنوات الرسمية.'},
{id:'b9',ch:'sms',from:'البنك',sub:'رسالة نصية',ctx:'<b>الموقف:</b> دفعت قبل دقيقة في الجمعية.',body:'تم خصم 4.250 د.ك من بطاقتك المنتهية بـ 4410 لدى الجمعية التعاونية.',insp:'يطابق مشترياتك قبل دقيقة، بلا رابط ولا طلب.',scam:0,ok:'إشعار يطابق عملية قمت بها أنت، ولا يطلب شيئًا.'}
);

ITEMS.push(

var CHG={sms:'msg',mail:'msg',notif:'msg',pop:'msg',call:'call',wa:'chat',social:'chat',game:'chat',life:'life'};
function grpOf(it){if(it.kind==='call')return 'call';if(it.kind==='pair')return 'safe';if(it.kind==='order')return null;if(!it.scam)return 'safe';return CHG[it.ch]||null}
function track(it,kind){var g=grpOf(it);if(!g)return;var x=PR.ix=PR.ix||{},a=x[g]=x[g]||[0,0];a[1]++;if(kind==='perfect')a[0]++;if(a[1]>40){a[0]*=.8;a[1]*=.8}}
function ixCalc(){var x=PR.ix||{},ok=0,n=0,rows=[],weak=null,best=null;Object.keys(GRP).forEach(function(g){var a=x[g];if(!a||a[1]<1)return;ok+=a[0];n+=a[1];var p=Math.round(a[0]/a[1]*100),r={g:g,p:p};rows.push(r);if(a[1]>=3&&(!weak||p<weak.p))weak=r;if(a[1]>=3&&(!best||p>best.p))best=r});return {n:n,p:n?Math.round(ok/n*100):0,rows:rows,weak:weak,best:best}}
function pool(){var ids=[];STAGES.forEach(function(st){st.ids.forEach(function(id){if(ids.indexOf(id)<0)ids.push(id)})});return ids.map(function(id){return BYID[id]})}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dayNum(t){var p=t.split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5)}
function seeded(arr,seed){var a=arr.slice(),z=seed;function r(){z=(z*1103515245+12345)&0x7fffffff;return z/0x7fffffff}for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function startDaily(){var k=dayNum(today()),p=seeded(pool(),k),sc=p.filter(function(x){return x.scam}).slice(0,4),ok=p.filter(function(x){return !x.scam}).slice(0,2);
 startStage(0,{kind:'daily',n:'تحدي اليوم',d:'',ids:seeded(sc.concat(ok),k+7).map(function(x){return x.id}),loss:kid()?10:20,bonus:kid()?30:40})}

 {id:'t3',ch:'notif',from:'البنك',sub:'إشعار من التطبيق',body:'تم إيداع راتبك في حسابك. لا يلزمك أي إجراء.',insp:'إشعار داخل التطبيق الرسمي، بلا رابط ولا طلب.',scam:0,coach:'<b>تمرين 3 من 3.</b> مو كل شي احتيال. هذي سليمة: {اسحب|اسحبي} <b>يمين</b> أو {اضغط|اضغطي} «أثق».',hand:'r'}

function tutJudge(how){
 var it=S.items[S.i],card=$('card');
 function back(msg){card.style.transform='';card.querySelectorAll('.stamp').forEach(function(x){x.style.opacity=0});say(msg,'mid');sfx.mid()}

/* ---------- rest stop ---------- */
var R=null;
function rest(){
 stopAll();
 var n=S.items.length,played=S.res.length,ok=0;S.res.forEach(function(r){if(r.kind==='perfect'||r.kind==='partial')ok++});
 var need=Math.ceil(n*.7),broke=S.bal<=0,pass=!broke&&ok>=need,miss=n-ok,medal=pass?(miss===0?3:miss===1?2:1):0;
 var reward=pass?S.pot+S.st.bonus*(S.pro?2:1):0,gotShield=false,d=doneMap(),cu=S.custom,first=!cu&&pass&&!d[S.stage],dl=null;
 PR.wallet=Math.max(0,S.bal)+reward;PR.shields=S.shields;
 if(pass&&!cu){d[S.stage]=Math.max(d[S.stage]||0,medal);if(!S.pro)PR.unlocked=Math.max(PR.unlocked,Math.min(STAGES.length,S.stage+1));
  if(medal===3&&PR.shields<3){PR.shields++;gotShield=true}}
 if(cu&&cu.kind==='daily'){var td=today(),D=PR.daily=PR.daily||{};if(D.d!==td){D.streak=(D.d&&dayNum(td)-dayNum(D.d)===1)?(D.streak||0)+1:1;D.d=td}D.ok=ok;D.n=n;dl=D}
 var adapt='';if(!S.pro&&!cu){var ad=PR.adapt||1;if(pass&&medal===3){PR.g=(PR.g||0)+1;PR.f=0}else if(!pass){PR.f=(PR.f||0)+1;PR.g=0}else{PR.g=0;PR.f=0}
  if(PR.g>=2){ad=Math.max(.75,ad*.88);PR.g=0;adapt='up'}if(PR.f>=2){ad=Math.min(1.5,ad*1.15);PR.f=0;adapt='down'}PR.adapt=ad}
 save(store);
 R={custom:cu,daily:dl,adapt:adapt,pass:pass,broke:broke,ok:ok,n:n,need:need,medal:medal,reward:reward,gotShield:gotShield,first:first,refilled:false,refillMsg:''};
 renderRest();show('report');
 if(pass)sfx.good();else sfx.bad();
}

 var st=S.st,last=S.stage===STAGES.length,kc={perfect:'var(--tq)',partial:'var(--saffron)',fell:'var(--coral)',miss:'var(--muted)',timeout:'var(--muted)'};
 var title=R.custom?(R.custom.kind==='daily'?'{خلّصت|خلّصتي} تحدي اليوم':'{خلّصت|خلّصتي} التمرين'):R.pass?(last?'{هزمت|هزمتي} بو حيلة!':'{عدّيت|عدّيتي} المرحلة '+S.stage):R.broke?(kid()?'بو حيلة أخذ كل نجومك':'بو حيلة صفّر محفظتك'):'ما {عدّيت|عدّيتي} المرحلة';
 var h='<div class="rtop"><div class="pct">استراحة · '+st.n+'</div>'+
  (R.custom?'<div class="rfoe">'+foeSvg(R.pass?'defeat':'gloat',1)+'</div>':R.medal?'<div class="bigmedal">'+medalSvg(R.medal)+'</div>':'<div class="rfoe">'+foeSvg('gloat',1)+'</div>')+
  '<div class="rk"'+(R.pass?'':' style="color:var(--coral)"')+'>'+title+'</div>'+
  '<div class="pct">'+R.ok+' صح من '+R.n+(R.custom?'':R.pass?' · وسام '+MEDAL[R.medal]:' · {تحتاج|تحتاجين} '+R.need+' {لتعبر|لتعبري}')+' · أعلى كومبو ×'+S.maxCombo+'</div>'+
  '<div class="grid">'+S.items.map(function(it,i){var r=S.res[i];return '<i class="'+(r?r.kind:'')+'"></i>'}).join('')+'</div>'+
  '<div class="ledger">'+
   (R.pass?'<div><span>جائزة المرحلة</span><b class="plus">+'+fmt(R.reward)+'</b></div>':'<div><span>جائزة المرحلة ضاعت</span><b class="minus">'+fmt(S.pot)+'</b></div>')+
   (S.loot>0?'<div><span>أخذه بو حيلة</span><b class="minus">−'+fmt(S.loot)+'</b></div>':'')+
   ((R.refillMsg&&R.refillAmt>0)?'<div><span>'+R.refillMsg+'</span><b class="plus">+'+fmt(R.refillAmt)+'</b></div>':'')+
   '<div class="tot"><span>محفظتك الآن</span><b id="rTot">'+fmt(PR.wallet)+' '+CUR()+'</b></div></div>'+
  (function(){var rw=null;REWARDS.forEach(function(r){if(r.at===S.stage)rw=r});return (R.first&&rw)?'<div class="award gift"><span><b>فتحت جائزة: '+rw.t+'</b><br>مثال توضيحي. الجائزة الحقيقية تُستلم من تطبيق البنك فقط.</span></div>':''})()+(R.daily?'<div class="award"><span><b>سلسلة '+R.daily.streak+(R.daily.streak>2&&R.daily.streak<11?' أيام':' يوم')+' 🔥</b> {ارجع|ارجعي} بكرة لتحدٍ جديد وتكمل السلسلة.</span></div>':'')+(R.gotShield?'<div class="award">'+SHIELD+'<span>وسام ذهبي = درع جديد. الدرع يمتص خطأك القادم.</span></div>':'')+(R.adapt==='up'?'<div class="award"><span><b>مستواك عالي!</b> صعّبناها شوي: الوقت صار أقصر.</span></div>':R.adapt==='down'?'<div class="award"><span><b>خذ راحتك.</b> زدنا الوقت وتلميحًا إضافيًا في المحاولة الجاية.</span></div>':'')+'</div>';
 var nxt=S.stage+1;
 if(PR.wallet<=0&&!R.refilled)h+='<p class="fine" style="color:var(--saffron)">محفظتك فاضية. {اشحن|اشحني} رصيدك من أوراق بو حيلة، أو {أعد|أعيدي} المرحلة '+(kid()?'ونعوّضك 60 نجمة.':'ويعوّضك البنك 60 د.ك.')+'</p>';
 var missed=[],okd=[];S.items.forEach(function(it,i){var r=S.res[i];if(!r)return;var row='<div style="--k:'+kc[r.kind]+'"><b>'+(it.cap?it.cap:bd(fx(it.from)))+(it.cap?'':it.scam?' · احتيال · ورقة '+LEVERS[it.lever].n:' · سليمة')+'</b><span>'+(it.scam?it.tell+(it.right?'<br><b style="display:inline;color:var(--fg)">الصح:</b> '+it.right:''):it.ok)+'</span></div>';(r.kind==='perfect'?okd:missed).push(row)});
 missed.sort(function(a,b){return (b.indexOf('احتيال')>0)-(a.indexOf('احتيال')>0)});
 if(missed.length)h+='<h2 class="lbl">أهم اللي فاتك</h2><div class="recap">'+missed.slice(0,2).join('')+'</div>';
 if(missed.length>2)h+='<details class="more"><summary>باقي اللي فاتك ('+(missed.length-2)+')</summary><div class="recap">'+missed.slice(2).join('')+'</div></details>';
 if(okd.length)h+='<details class="more"><summary>اللي {كشفته|كشفتيه} صح ('+okd.length+')</summary><div class="recap">'+okd.join('')+'</div></details>';
 h+='<div class="btns">'+(!R.refilled?'<button class="ghost gold" id="rRefill">{اشحن|اشحني} رصيدك: {اقرأ|اقرئي} أوراق بو حيلة</button>':'')+(R.pass&&!last&&!R.custom?'<button class="ghost" id="rShare">{تحدَّ|تحدَّي} أهلك بنتيجتك</button>':'')+(R.pass&&!R.custom?'<button class="ghost" id="rRetry">{أعد|أعيدي} المرحلة لوسام أعلى</button>':'')+'<button class="ghost" id="rMap">خريطة المراحل</button></div>';
 h+='<p class="fine">'+(kid()?'إذا صار لك شي مثل هذا في الواقع، {قول|قولي} لأهلك فورًا.':'إذا {وقعت|وقعتي} فعلًا في الواقع: {اتصل|اتصلي} ببنكك فورًا لإيقاف البطاقة ثم {بلّغ|بلّغي} الجهات المختصة.')+'</p>';
 h+='<div class="sticky">'+(R.custom?(R.custom.kind==='daily'?'<button class="cta" id="rShare">{تحدَّ|تحدَّي} أهلك بتحدي اليوم</button>':'<button class="cta" id="rIdx">مؤشر الوعي</button>'):R.pass&&!last?'<button class="cta" id="rNext">المرحلة '+nxt+': '+STAGES[nxt-1].n+'</button>':!R.pass?'<button class="cta" id="rRetry">{أعد|أعيدي} المرحلة</button>':'<button class="cta" id="rShare">{تحدَّ|تحدَّي} أهلك بنتيجتك</button>')+'</div>';
 var el=$('report');el.innerHTML=gx(h);el.scrollTop=0;
 (function(){var t=$('rTot'),from=R.shown===undefined?S.startBal:R.shown,to=PR.wallet,t0=performance.now();R.shown=to;if(!t||from===to)return;
  (function step(n){var k=Math.min(1,(n-t0)/900);t.textContent=fmt(from+(to-from)*k)+' '+CUR();if(k<1)requestAnimationFrame(step)})(t0)})();
 var b;
 if((b=$('rNext')))b.onclick=function(){startStage(nxt)};
 if((b=$('rRetry')))b.onclick=function(){startStage(S.stage)};
 if((b=$('rRefill')))b.onclick=startFlip;
 if((b=$('rShare')))b.onclick=function(){doShare()};if((b=$('rIdx')))b.onclick=function(){renderHome();show('home');openIndex()};
 $('rMap').onclick=function(){renderHome();show('home')};
}
function shareText(){
 if(R&&R.daily&&!$('report').hidden)return 'واعي · تحدي اليوم\nكشفت '+R.ok+' من '+R.n+' · سلسلة '+R.daily.streak+' يوم 🔥\nنفس البطاقات عندك اليوم. تقدر تغلبني؟'+(ART_URL?'\n'+ART_URL:'');
 var d=PR.done,g=0,s=0,b=0;Object.keys(d).forEach(function(k){if(d[k]===3)g++;else if(d[k]===2)s++;else b++});
 var top=0;Object.keys(d).forEach(function(k){top=Math.max(top,+k)});
 var t='واعي · لنكن على دراية\nعدّيت '+Object.keys(d).length+' من '+STAGES.length+' مراحل ضد بو حيلة\n🥇×'+g+' 🥈×'+s+' 🥉×'+b+' · محفظتي '+fmt(PR.wallet)+' '+CUR()+'\nتقدر تغلبني؟';
 if(ART_URL)t+='\n'+ART_URL+'#tahaddi-'+top+'-'+Math.round(PR.wallet);
 return t;
}
function doShare(tx){
 var t=typeof tx==='string'?tx:shareText();
 function fallback(){var s=sheet('<h3>انسخ نتيجتك<small>حدّد النص وانسخه، ثم ألصقه في قروب العائلة</small></h3><textarea class="copybox" id="copybox" readonly></textarea><button class="ghost" id="closeS">تم</button>');var b=s.querySelector('#copybox');b.value=t;b.focus();b.select();s.querySelector('#closeS').onclick=closeSheet}
 try{navigator.clipboard.writeText(t).then(function(){toast('نُسخت النتيجة. ألصقها في قروب العائلة')},fallback)}catch(e){fallback()}
}

/* ---------- refill mini-game ---------- */
var F={};
function startFlip(){
 var list=shuffle(S.items.filter(function(it){return it.scam&&!it.cap})).slice(0,3);
 F={list:list,i:0,ok:0,each:15+5*S.stage,done:false};show('flip');renderFlip();
}
function renderFlip(){
 var el=$('flip');S.flipEl=el;
 if(F.i>=F.list.length){
  var amt=F.ok*F.each,msg='تعبئة الاستراحة';
  if(PR.wallet+amt<60){amt=60-PR.wallet;msg=kid()?'تعويض لأنك {أخبرت|أخبرتي} أهلك بسرعة':'تعويض البنك لأنك {بلّغت|بلّغتي} بسرعة'}
  PR.wallet+=amt;save(store);R.refilled=true;R.refillMsg=msg;R.refillAmt=amt;
  el.innerHTML=gx('<div class="rtop"><div class="pct">تعبئة الرصيد</div><div class="rk">{قرأت|قرأتي} '+F.ok+' من '+F.list.length+'</div><div class="big">+'+fmt(amt)+'<small> '+CUR()+'</small></div><div class="pct">بو حيلة لا يملك إلا خمس أوراق. من يعرفها يكشفه مهما غيّر القصة.</div></div>'+
   '<div class="recap">'+Object.keys(LEVERS).map(function(k){var l=LEVERS[k];return '<div style="--k:var(--saffron)"><b>'+l.n+'</b><span>'+l.how+'<br>الرد: '+l.anti+'</span></div>'}).join('')+'</div>'+
   '<button class="cta" id="flipBack">رجوع إلى الاستراحة</button>');
  el.scrollTop=0;if(amt>0)sfx.good();$('flipBack').onclick=function(){renderRest();show('report')};return;
 }
 var it=F.list[F.i];
 el.innerHTML='<div class="fliphead"><b>أي ورقة لعبها بو حيلة هنا؟</b><span>'+(F.i+1)+' من '+F.list.length+' · كل إجابة صحيحة +'+F.each+' '+CUR()+'</span></div>'+
  '<div class="quote"><small>'+bd(fx(it.from))+' · '+CH[it.ch]+'</small>'+mk(fx(it.body))+'</div>'+
  '<div class="lgrid">'+Object.keys(LEVERS).map(function(k){return '<button class="opt" data-k="'+k+'" id="lev-'+k+'">'+LICO[k]+LEVERS[k].n+'</button>'}).join('')+'</div><div id="flipFb"></div>';
 el.scrollTop=0;F.done=false;
 el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
  if(F.done)return;F.done=true;var k=b.getAttribute('data-k'),right=k===it.lever;
  if(right){F.ok++;sfx.hit(F.ok+2)}else{sfx.mid();b.classList.add('no')}
  $('lev-'+it.lever).classList.add('ok');
  var l=LEVERS[it.lever];
  $('flipFb').innerHTML='<div class="fact" style="margin-bottom:.7rem"><small>'+(right?'صح، +'+F.each+' '+CUR():'الورقة كانت')+': '+l.n+'</small>'+l.how+'<br><b>الرد عليها:</b> '+l.anti+'</div><button class="cta" id="flipNext">التالي</button>';
  $('flipNext').onclick=function(){F.i++;renderFlip()};
  $('flipNext').scrollIntoView({block:'nearest'});
 }});
}

  ['kid','youth','elder'].forEach(function(k){t.querySelector('#a-'+k).onclick=function(){
   var was=store.age;store.age=k;if(first&&k==='elder'){S.big=true;store.big=true}store.asked=1;save(store);setProfile();closeSheet();renderHome();
   if(!first&&was!==k)toast('{انتقلت|انتقلتي} لمراحل '+AGE[k].n+'. تقدّمك في كل فئة محفوظ.')}})
 }

if(!store.age)openWho(true);

})();
