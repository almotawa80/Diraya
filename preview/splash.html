<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>معاينة شاشة البداية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--deep:#232C5A;--fg:#F6F6F0;--gold:#E3BE7C;--tq:#1FC8B4;--coral:#FF6B6B;--muted:#B9BCD3}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:Cairo,sans-serif;background:var(--deep);color:var(--fg);overflow:hidden}
.pick{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;text-align:center}
.pick h1{font-size:1.4rem;font-weight:900}.pick p{color:var(--muted);font-size:.9rem}
.pick button{width:100%;max-width:20rem;border:0;border-radius:16px;background:var(--gold);color:var(--deep);font:800 1.05rem Cairo;padding:1rem}
.pick button.b2{background:#ffffff14;color:var(--fg)}
.sp{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,#2E3A78,#1A2149 70%);z-index:5}
.sp[hidden]{display:none}
/* 1: shield shine */
.s1 .shield{width:11rem;position:relative;animation:drop .9s cubic-bezier(.2,1.4,.4,1) both}
.s1 .shield img{width:100%;display:block;filter:drop-shadow(0 12px 30px rgba(0,0,0,.45))}
.s1 .shine{position:absolute;inset:0;-webkit-mask:url(../img/logo.png) center/contain no-repeat;mask:url(../img/logo.png) center/contain no-repeat;overflow:hidden}
.s1 .shine::after{content:'';position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.85),transparent);transform:skewX(-18deg);animation:sweep 1s .95s ease-in-out both}
.s1 h2{font-size:3.2rem;font-weight:900;margin-top:.6rem;animation:up .6s 1.2s both}
.s1 p{color:var(--gold);font-weight:700;font-size:1.05rem;letter-spacing:.02em;animation:up .6s 1.45s both}
.s1 .line{width:0;height:2px;background:var(--gold);margin:.7rem auto 0;animation:grow .7s 1.6s forwards}
@keyframes drop{from{transform:translateY(-60vh) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes sweep{to{left:120%}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{to{width:7rem}}
/* 2: incoming call */
.s2 .call{display:flex;flex-direction:column;align-items:center;gap:.4rem;animation:buzz .5s 3}
.s2 .av{width:6.5rem;height:6.5rem;border-radius:50%;background:#ffffff14;display:grid;place-items:center;font-size:3rem;margin-bottom:.5rem;box-shadow:0 0 0 0 rgba(31,200,180,.6);animation:ring 1.2s 2}
.s2 .who{font-size:1.6rem;font-weight:800}.s2 .num{color:var(--muted);direction:ltr}
.s2 .btns{display:flex;gap:3.5rem;margin-top:2.5rem}.s2 .btns span{width:4.2rem;height:4.2rem;border-radius:50%;display:grid;place-items:center;font-size:1.6rem}
.s2 .flip{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2E3A78,#1A2149 70%);opacity:0;transform:rotateY(90deg)}
.s2.go .call{animation:out .35s forwards}.s2.go .flip{animation:in .45s .3s forwards}
.s2 .flip img{width:9rem;filter:drop-shadow(0 12px 30px rgba(0,0,0,.45))}
.s2 .flip h2{font-size:3rem;font-weight:900;margin-top:.4rem}
.s2 .flip p{color:var(--gold);font-weight:700;font-size:1.05rem}
@keyframes buzz{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-1deg)}40%{transform:translateX(6px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes ring{70%{box-shadow:0 0 0 22px rgba(31,200,180,0)}100%{box-shadow:0 0 0 0 rgba(31,200,180,0)}}
@keyframes out{to{transform:rotateY(-90deg);opacity:0}}
@keyframes in{to{transform:none;opacity:1}}
.again{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:0;border-radius:99px;background:#ffffff1f;color:var(--fg);font:700 .85rem Cairo;padding:.5rem 1.2rem;z-index:9;opacity:0;transition:opacity .3s}
.again.on{opacity:1}
</style></head><body>
<div class="pick" id="pick">
 <h1>معاينة شاشة البداية</h1><p>كل وحدة تاخذ حوالي ثانيتين، وبعدها تدخل اللعبة.</p>
 <button onclick="play(1)">1. الدرع يلمع</button>
 <button class="b2" onclick="play(2)">2. مكالمة واردة</button>
</div>
<div class="sp s1" id="s1" hidden><div class="shield"><img src="../img/logo.png" alt=""><div class="shine"></div></div><h2>واعي</h2><p>لنكن على دراية</p><div class="line"></div></div>
<div class="sp s2" id="s2" hidden>
 <div class="call"><div class="av">👤</div><div class="who">رقم مجهول</div><div class="num">+965 •••• ••••</div><div class="btns"><span style="background:var(--tq)">✆</span><span style="background:var(--coral)">✆</span></div></div>
 <div class="flip"><img src="../img/logo.png" alt=""><h2>واعي</h2><p>لا ترد قبل لا تتأكد</p></div>
</div>
<button class="again" id="again" onclick="back()">رجوع للاختيار</button>
<script>
var AC;function ring(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var a=AC,t=a.currentTime+.05,d=1.2,v=a.createGain(),m=a.createGain(),l=a.createOscillator(),lg=a.createGain();
 v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(.07,t+.03);v.gain.setValueAtTime(.07,t+d-.12);v.gain.exponentialRampToValueAtTime(.0001,t+d);
 l.frequency.value=20;lg.gain.value=.35;m.gain.value=.65;l.connect(lg);lg.connect(m.gain);[440,480].forEach(function(f){var o=a.createOscillator();o.frequency.value=f;o.connect(m);o.start(t);o.stop(t+d+.05)});m.connect(v);v.connect(a.destination);l.start(t);l.stop(t+d+.05)}catch(e){}}
function chime(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var a=AC;[[1319,0],[1760,.12]].forEach(function(x){var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+x[1];o.type='triangle';o.frequency.value=x[0];g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.06,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.6);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.7)})}catch(e){}}
function reset(el){var c=el.cloneNode(true);el.parentNode.replaceChild(c,el);return c}
function play(n){document.getElementById('pick').hidden=true;var el=reset(document.getElementById('s'+n));el.hidden=false;
 if(n===1){setTimeout(chime,950)}
 else{ring();if(navigator.vibrate)navigator.vibrate([300,150,300]);setTimeout(function(){el.classList.add('go')},1500)}
 setTimeout(function(){document.getElementById('again').classList.add('on')},2600)}
function back(){['s1','s2'].forEach(function(i){document.getElementById(i).hidden=true});document.getElementById('again').classList.remove('on');document.getElementById('pick').hidden=false}
</script></body></html>
